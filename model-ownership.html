<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCC — Model Ownership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12233A; --mute:#5A7391; --line:#D8E3EE; --blue:#0B2447; --blue2:#13507C;
  --cap:#0077B6; --da:#7B4FC9; --bg2:#1E7A46; --ds:#C2690A; --found:#2E7D32; --fin:#B8860B;
  --paper:#F4F7FB;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Sarabun','Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}

/* ---------- toolbar ---------- */
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 16px;background:#fff;
  border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(18,35,58,.06);flex:none;z-index:20}
.bar .brand{margin-right:6px;line-height:1.15}
.bar .brand b{display:block;font-family:'Inter';font-size:13.5px;font-weight:800;color:var(--blue)}
.bar .brand span{font-family:'Inter';font-size:8.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#93A6BA}
.bar a.back,.bar button{font:600 11px 'Inter','Sarabun',sans-serif;text-transform:uppercase;letter-spacing:.02em;
  color:#41566E;border:1px solid var(--line);padding:6px 11px;border-radius:7px;background:#fff;
  text-decoration:none;cursor:pointer;white-space:nowrap;transition:.12s}
.bar a.back:hover,.bar button:hover{background:#F2F8FD;border-color:#B9D3E8}
.bar button.pub{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.bar button.pub:hover{background:#0f4066}
.bar button.on{background:var(--blue2);color:#fff;border-color:var(--blue2)}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.bar .sp{flex:1}
#autosave{font:700 9px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:#A9BACB;transition:.2s}
#autosave.hit{color:var(--found)}

/* ---------- stage ---------- */
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#sheet{position:relative;width:1840px;height:1440px;flex:0 0 auto;transform-origin:center center;
  background:#FBFDFF;border:1px solid var(--line);border-radius:22px;box-shadow:0 26px 70px rgba(18,35,58,.13);
  overflow:hidden}
#wires{position:absolute;inset:0;pointer-events:none;z-index:1}
#sheet>*:not(#wires):not(.lane){position:absolute;z-index:2}

/* ---------- head ---------- */
#head{left:56px;top:26px;width:660px}
#head h1{font-family:'Inter','Sarabun';font-size:24px;font-weight:900;margin:0;letter-spacing:-.01em;line-height:1.25}
#head p{font-size:12.5px;color:var(--mute);margin:8px 0 0;line-height:1.6}
#legend{right:56px;top:32px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
#legend .li{display:flex;align-items:center;gap:9px;font-size:11.5px;color:#41566E;font-weight:600}
#legend .sw{width:34px;height:0;border-top:3px solid #2E7D32;border-radius:2px;background:none;
  box-shadow:none;padding:0;border-left:0;border-right:0;border-bottom:0}
#legend .sw-own{border-top:3px solid #C2690A}
#legend .sw-use{border-top:3px dashed #8AA0B6}

/* ---------- COE ---------- */
#coe{left:620px;top:168px;width:600px;background:linear-gradient(135deg,#1B5E20,#2E7D32);border-radius:20px;
  padding:16px 22px 20px;color:#fff;box-shadow:0 18px 44px rgba(27,94,32,.3)}
#coe .kd{font:800 9.5px 'Inter',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#BFE3C6}
#coe h2{font-family:'Inter','Sarabun';font-size:21px;font-weight:900;margin:5px 0 3px}
#coe .sub{font-size:11.5px;color:#D6EDDA;line-height:1.55}
#coe .two{display:flex;gap:13px;margin-top:13px}
#coe .two a,#coe .two div{flex:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  border-radius:12px;padding:10px 13px;text-decoration:none;color:#fff;transition:.12s;display:block}
#coe .two a:hover{background:rgba(255,255,255,.24)}
#coe .two b{display:block;font-family:'Inter','Sarabun';font-size:14px;font-weight:800}
#coe .two span{display:block;font-size:10.5px;color:#CFE8D4;margin-top:3px;line-height:1.5}

/* ---------- owner companies ---------- */
.own{border-radius:16px;padding:13px 17px 15px;background:#fff;border:1px solid var(--line);
  border-top:5px solid var(--ds);box-shadow:0 11px 28px rgba(18,35,58,.09)}
.own .ttl{display:flex;align-items:baseline;gap:9px}
.own .ttl b{font-family:'Inter',sans-serif;font-size:25px;font-weight:900;color:var(--ds);letter-spacing:.02em}
.own .ttl span{font-size:11px;color:#6A82A0}
.own .rl{display:block;font-size:11.5px;color:#41566E;margin-top:7px;line-height:1.55}
.own .own-tag{display:inline-block;margin-top:9px;font:800 9.5px 'Inter',sans-serif;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 9px;border-radius:9px;background:#FFF1DB;color:#9A6508}

/* ---------- reference models ---------- */
.mdl{border-radius:15px;padding:12px 15px 14px;background:#fff;border:1px solid var(--line);
  border-top:5px solid var(--da);box-shadow:0 9px 24px rgba(18,35,58,.08);text-decoration:none;color:inherit;display:block}
a.mdl:hover{background:#FAFBFE}
.mdl b{display:block;font-family:'Inter',sans-serif;font-size:18px;font-weight:900;color:var(--da);letter-spacing:-.01em}
.mdl .en{display:block;font-size:10.5px;color:#6A82A0;margin-top:2px;line-height:1.4}
.mdl .ax{display:block;font-size:10.5px;color:#41566E;margin-top:7px;line-height:1.5;
  border-top:1px dashed var(--line);padding-top:7px}

/* ---------- stakeholders ---------- */
.stk{border-radius:13px;padding:10px 13px;background:#F7FBFE;border:1px solid #CFE0EF;border-left:4px solid #8AA0B6}
.stk .h{display:block;font:800 9.5px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#7D93AA}
.stk .b{display:block;font-size:11px;color:#41566E;margin-top:5px;line-height:1.55}

/* ---------- layer band ---------- */
.band{border-radius:18px;padding:14px 20px 17px}
.band>h3{font-family:'Inter','Sarabun';font-size:13.5px;font-weight:800;margin:0 0 11px;letter-spacing:.01em;
  display:flex;align-items:center;gap:9px}
.band>h3 .pill{font:800 10px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:9px;color:#fff;flex:none;background:var(--da)}
table.lay{width:100%;border-collapse:collapse;font-size:11.5px}
table.lay th{background:var(--blue2);color:#fff;font:700 10.5px 'Inter','Sarabun';padding:6px 9px;
  text-align:left;border:1px solid #14496e}
table.lay th.c{text-align:center;width:88px}
table.lay td{border:1px solid var(--line);padding:6px 9px;line-height:1.5;background:#fff}
table.lay td.c{text-align:center;font-family:'Inter';font-weight:900;font-size:13px}
table.lay td.y{color:#2E7D32}
table.lay td.n2{color:#C9D3DE}
table.lay td.g{font-weight:800;color:var(--blue2);white-space:nowrap}
table.lay tr.sh td{background:#F3EDFB}
#bLayer{left:96px;top:930px;width:1648px;background:#F8F5FD;border:1px solid #DDD2EF}
.teams{display:flex;gap:14px;margin-top:13px}
.teams .t{flex:1;border-radius:12px;padding:11px 14px;background:#fff;border:1px solid #DDD2EF;border-left:4px solid var(--da)}
.teams .t b{display:block;font-family:'Inter','Sarabun';font-size:12.5px;font-weight:800;color:#5F39A3;line-height:1.3}
.teams .t span{display:block;font-size:10.5px;margin-top:4px;line-height:1.5;color:#5A6E88}

@media print{
  @page{size:A3 landscape;margin:8mm}
  body{overflow:visible;background:#fff}
  .bar,.tip,#tokPanel{display:none!important}
  #stage{overflow:visible;padding:0}
  #sheet{box-shadow:none;border:0}
}
</style>
</head>

  tip._t=setTimeout(function(){t.classList.remove('show')},2800); }

/* ================= state ================= */
function fileData(){ try{ var o=JSON.parse($('mown-data').textContent); if(o) return o; }catch(e){} return {}; }
var FD=fileData(), baseSavedAt=(typeof FD.savedAt==='number')?FD.savedAt:0;
var S=null;
try{ var raw=localStorage.getItem(LSK); if(raw){ var ls=JSON.parse(raw); if(ls&&ls.root&&(ls.savedAt||0)>=baseSavedAt) S=ls; } }catch(e){}
if(!S) S=FD;
if(typeof S.savedAt!=='number') S.savedAt=baseSavedAt;
function persist(){ try{ localStorage.setItem(LSK,JSON.stringify(S)); var a=$('autosave'); a.classList.add('hit');
  setTimeout(function(){a.classList.remove('hit')},450); }catch(e){} }

  }).join('');

  $('owners').innerHTML=(S.owners||[]).map(function(o,i){

  }).join('');

  $('models').innerHTML=(S.models||[]).map(function(m,i){

            '<span class="ax" data-k="models.'+i+'.ax">'+m.ax+'</span>';
    return '<div style="position:absolute;left:'+m.x+'px;top:620px;width:250px">'+
      (m.href?'<a class="mdl" href="'+m.href+'" id="m_'+m.id+'">'+in_+'</a>'
             :'<div class="mdl" id="m_'+m.id+'">'+in_+'</div>')+'</div>';
  }).join('');

  $('stakes').innerHTML=(S.models||[]).map(function(m,i){
    return '<div class="stk" id="s_'+m.id+'" style="position:absolute;left:'+m.x+'px;top:800px;width:250px">'+
      '<span class="h">ผู้เกี่ยวข้อง</span><span class="b" data-k="models.'+i+'.stake">'+m.stake+'</span></div>';
  }).join('');

  var h='<tr><th>Layer</th>'+(S.models||[]).map(function(m){ return '<th class="c">'+esc(m.k)+'</th>'; }).join('')+
        '<th>ทีมที่ดูแล และมาตรฐานที่ใช้ร่วมกัน</th></tr>';
  (S.layers||[]).forEach(function(r){
    h+='<tr'+(r.sh?' class="sh"':'')+'><td class="g">'+esc(r.n)+'</td>'+
       (S.models||[]).map(function(m){ var v=r[m.id];
         return '<td class="c '+(v?'y':'n2')+'">'+(v?(v===1?'●':esc(v)):'–')+'</td>'; }).join('')+
       '<td>'+r.team+'</td></tr>';
  });
  $('tLayer').innerHTML=h;
  $('teams').innerHTML=(S.teams||[]).map(function(t,i){
    return '<div class="t"><b data-k="teams.'+i+'.t">'+t.t+'</b><span data-k="teams.'+i+'.s">'+t.s+'</span></div>';
  }).join('');

  $('legend').innerHTML=(S.legend||[]).map(function(l){
    return '<div class="li"><span>'+esc(l.t)+'</span><span class="sw sw-'+l.k+'"></span></div>';
  }).join('');
  setEditable();
  requestAnimationFrame(function(){ drawWires(); fit(); });
}

/* ================= wires ================= */
function box(id){
  var el=$(id), sh=$('sheet');
  var tf=sh.style.transform, mg=sh.style.margin;
  sh.style.transform='none'; sh.style.margin='0';
  var a=el.getBoundingClientRect(), b=sh.getBoundingClientRect();
  sh.style.transform=tf; sh.style.margin=mg;
  return {x:a.left-b.left,y:a.top-b.top,w:a.width,h:a.height};
}
function pt(bx,side){
  if(side==='t') return [bx.x+bx.w/2,bx.y];
  if(side==='b') return [bx.x+bx.w/2,bx.y+bx.h];
  if(side==='l') return [bx.x,bx.y+bx.h/2];
  return [bx.x+bx.w,bx.y+bx.h/2];
}
function curve(p1,p2){
  var dy=Math.max(30,Math.abs(p2[1]-p1[1])*0.5);
  return 'M'+p1[0]+','+p1[1]+' C'+p1[0]+','+(p1[1]+dy)+' '+p2[0]+','+(p2[1]-dy)+' '+p2[0]+','+p2[1];
}
function drawWires(){
  var defs='<defs>'+['own:#C2690A','use:#8AA0B6','coe:#2E7D32'].map(function(d){
      var q=d.split(':');
      return '<marker id="ar-'+q[0]+'" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
             '<path d="M0 0 L10 5 L0 10 z" fill="'+q[1]+'"/></marker>';
    }).join('')+
    '<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">'+
    '<feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0B2447" flood-opacity=".14"/></filter></defs>';
  var g={coe:[],own:[],use:[]};
  (S.owners||[]).forEach(function(o){ g.coe.push(curve(pt(box('coe'),'b'),pt(box('o_'+o.k),'t'))); });
  (S.models||[]).forEach(function(m){
    g.own.push(curve(pt(box('o_'+m.owner),'b'),pt(box('m_'+m.id),'t')));
    g.use.push(curve(pt(box('m_'+m.id),'b'),pt(box('s_'+m.id),'t')));
  });
  /* สะพาน SGAM ↔ RAMI 4.0 — สินค้า Precise อยู่ทั้งสองแผนที่ */
  if(S.bridge){
    var A=box('m_'+S.bridge.a), B=box('m_'+S.bridge.b);
    var y=A.y+A.h*0.5;
    g.use.push('M'+(A.x+A.w)+','+y+' C'+(A.x+A.w+60)+','+(y-90)+' '+(B.x-60)+','+(y-90)+' '+B.x+','+y);
  }
  var style={coe:'stroke:#2E7D32;stroke-width:3.2',
             own:'stroke:#C2690A;stroke-width:3',
             use:'stroke:#8AA0B6;stroke-width:2;stroke-dasharray:7 7;opacity:.9'};
  var h=defs;
  ['use','own','coe'].forEach(function(k){
    h+='<g fill="none" style="'+style[k]+'" stroke-linecap="round" filter="url(#soft)" marker-end="url(#ar-'+k+')">'+
       g[k].map(function(d){ return '<path d="'+d+'"/>'; }).join('')+'</g>';
  });
  $('wires').innerHTML=h;
}

/* ================= fit ================= */
function fit(){
  var st=$('stage'), sh=$('sheet');
  sh.style.transform='none'; sh.style.margin='0';
  var sc=Math.min((st.clientWidth-26)/W,(st.clientHeight-26)/H,1.5);
  sh.style.transform='scale('+sc.toFixed(4)+')';
  sh.style.margin=(-(H*(1-sc))/2).toFixed(1)+'px '+(-(W*(1-sc))/2).toFixed(1)+'px';
}
window.addEventListener('resize',function(){ requestAnimationFrame(function(){ drawWires(); fit(); }); });

/* ================= edit ================= */
var editMode=false;
function setEditable(){
  document.body.classList.toggle('edit',editMode);
  document.querySelectorAll('[data-k]').forEach(function(el){ el.setAttribute('contenteditable',editMode?'true':'false'); });
}
function setPath(path,val){
  var p=path.split('.'), o=S;
  for(var i=0;i<p.length-1;i++){ var k=/^\d+$/.test(p[i])?+p[i]:p[i]; if(o[k]==null) o[k]={}; o=o[k]; }
  var last=/^\d+$/.test(p[p.length-1])?+p[p.length-1]:p[p.length-1];
  o[last]=val;
}
$('bEdit').addEventListener('click',function(){
  editMode=!editMode; this.classList.toggle('on',editMode); setEditable();
  tip(editMode?'แก้ข้อความได้ทุกกล่อง · ลิงก์ถูกปิดชั่วคราว':'ล็อกแล้ว');
});
document.addEventListener('input',function(e){
  var el=e.target.closest('[data-k]'); if(!el||!editMode) return;
  setPath(el.dataset.k, el.innerHTML); schedulePersist();
  requestAnimationFrame(drawWires);
});
$('bFull').addEventListener('click',function(){
  if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
});
$('bPrint').addEventListener('click',function(){ window.print(); });
document.addEventListener('keydown',function(e){
  var ae=document.activeElement, typing=ae&&(ae.isContentEditable||ae.tagName==='INPUT');
  if(typing) return;
  if(e.key==='f'||e.key==='F'){ e.preventDefault(); $('bFull').click(); }
});

/* ================= publish ================= */
function tokGet(){ try{ return localStorage.getItem('pcc_gh_tok')||''; }catch(e){ return ''; } }
$('bTok').addEventListener('click',function(){ var p=$('tokPanel'); p.hidden=!p.hidden; if(!p.hidden) $('tokInput').focus(); });
$('tokSave').addEventListener('click',function(){
  var v=$('tokInput').value.trim(); if(!v) return;
  try{ localStorage.setItem('pcc_gh_tok',v); }catch(e){}
  $('tokInput').value=''; $('tokPanel').hidden=true; tip('บันทึก token แล้ว');
});
$('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} tip('ลบ token แล้ว'); });
function encodeB64(str){ var b=new TextEncoder().encode(str),r='',ch=3*1024;
  for(var i=0;i<b.length;i+=ch){ var sl=b.subarray(i,i+ch),bin='';
    for(var j=0;j<sl.length;j++) bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
var DATA_RE=/<!--MOWN_DATA_START-->[\s\S]*?<!--MOWN_DATA_END-->/;
function dataBlock(json){ return '<!--MOWN_DATA_START-->\n<script id="mown-data" type="application/json">'+json+'<\/script>\n<!--MOWN_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ $('tokPanel').hidden=false; tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=$('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo;
  function gh(m,p,body,accept){ var hh={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'};
    var o={method:m,headers:hh}; if(body!=null){ hh['Content-Type']='application/json'; o.body=JSON.stringify(body); }
    return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var m=''; try{ m=(await res.json()).message||''; }catch(_){}
    throw new Error(label+' ('+res.status+') '+m); } return res; }
  try{
    var rawRes=await gh('GET',base+'/contents/'+GH.file+'?ref='+GH.branch,null,'application/vnd.github.raw');
    await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST',base+'/git/blobs',{content:encodeB64(out),encoding:'base64'});
    await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET',base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้');
    var ref=await refRes.json(), headSha=ref.object.sha;
    var hcRes=await gh('GET',base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST',base+'/git/trees',{base_tree:hc.tree.sha,
      tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}]});
    await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST',base+'/git/commits',{
      message:'Model ownership update via browser ['+new Date().toISOString().slice(0,16)+']',
      tree:tree.sha, parents:[headSha]});
    await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH',base+'/git/refs/heads/'+GH.branch,{sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persist(); tip('✓ บันทึกขึ้นเว็บแล้ว — live ใน ~1 นาที');
  }catch(e){ S.savedAt=prev; tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}
$('bPublish').addEventListener('click',publish);

/* ================= boot ================= */
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ drawWires(); fit(); });
setTimeout(function(){ drawWires(); fit(); },350);
</script>
