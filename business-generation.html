<style>
:root{--paper:#F0F4F8;--card:#FFFFFF;--ink:#1E3A5F;--mute:#5A6E88;--line:#D3DEEA;
  --blue:#0077B6;--blue2:#005A8E;--orange:#F7941D;--green:#2E7D32;--hi:#F5B301}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 50% -12%,#FFFFFF 0%,transparent 60%),var(--paper);
  color:var(--ink);font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
h1{font-family:'Inter','Sarabun',sans-serif;margin:0}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 14px;background:rgba(240,244,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:4px}
.brand b{font-family:'Inter';font-size:13px;font-weight:800;color:var(--blue2)}
.brand span{font-family:'Inter';font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8FA3B8}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.lbl{font-family:'Inter';font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#93A6BA}
button{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  background:#fff;color:#41566E;border:1px solid var(--line);padding:6px 9px;cursor:pointer;border-radius:6px;white-space:nowrap;transition:.14s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.pub{background:var(--blue2);border-color:var(--blue2);color:#fff}
button.pub:hover{background:#00466f;border-color:#00466f;color:#fff}
button:disabled{opacity:.5;cursor:default}
a.back{font-family:'Inter';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;
  text-decoration:none;color:#41566E;border:1px solid var(--line);padding:6px 9px;border-radius:6px}
a.back:hover{border-color:var(--blue);color:var(--blue)}
label.clr{display:inline-flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff}
label.clr input[type=color]{width:20px;height:18px;border:none;padding:0;background:none;cursor:pointer}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw:hover{transform:scale(1.12)}
#autosave{font-family:'Inter';font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#B7C4D2;margin-left:auto;transition:color .25s}
#autosave.hit{color:var(--green)}
.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 22px rgba(30,58,95,.25)}
.tip.show{opacity:.96}
.wrap{max-width:1760px;margin:0 auto;padding:20px 16px 90px}
.hd-title{font-size:22px;font-weight:800;color:var(--blue2);margin:0 0 2px}
.hd-sub{font-size:12.5px;color:var(--mute);margin:0 0 16px}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 18px rgba(30,58,95,.07);background:#fff}
table{border-collapse:collapse;table-layout:fixed;width:auto;font-size:13px}
thead th{background:var(--blue2);color:#fff;font-family:'Inter','Sarabun',sans-serif;font-weight:700;font-size:12px;
  padding:6px 9px;text-align:left;vertical-align:middle;border:1px solid #14496e;position:relative}
thead tr:nth-child(2) th{background:#0a5b8c}
thead .hlabel{outline:none;display:inline-block;min-width:14px}
thead .th-tools{position:absolute;top:0;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:1px;
  background:rgba(2,40,72,.94);z-index:8;padding:0 1px;border-radius:0 0 5px 5px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
body.edit thead th:hover .th-tools{display:flex}
thead .th-tools button{padding:0 6px;font-size:11px;line-height:16px;border:none;background:transparent;color:#fff;text-transform:none;border-radius:3px}
thead .th-tools button:hover{background:rgba(255,255,255,.22)}
thead .th-tools .delcol:hover{background:#C0392B}
body:not(.edit) .th-tools{display:none}
.rz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:7}
.rz:hover{background:rgba(255,255,255,.4)}
tbody td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;white-space:pre-wrap;line-height:1.45;
  color:#26384d;font-size:calc(13px * var(--tfs,1));overflow-wrap:anywhere;word-break:break-word}
tbody tr:hover td{background:#F7FBFE}
td.c-no{width:38px;text-align:center;font-weight:800;color:var(--blue2)}
td.c-unit{width:80px;font-weight:600}
td.c-yr{width:58px;text-align:right;font-variant-numeric:tabular-nums}
th.c-yr{text-align:right}
.c-team{min-width:130px;font-weight:700;color:var(--blue2)}
.c-mgmt,.c-dev{min-width:150px}
.c-strat{min-width:300px}
.c-extra{min-width:120px}
tbody tr.grp td{border-top:2px solid var(--blue2)}
tbody tr.total td{background:#EAF3FA;font-weight:800}
tbody tr.total td.c-unit{color:var(--blue2)}
tbody tr.grand td{background:#D3E7F6;font-weight:800;border-top:2px solid var(--blue2);border-bottom:2px solid var(--blue2)}
tbody td.calc{background:#F2F8FC;color:#0a4a72}
tbody tr.total td.calc,tbody tr.grand td.calc{background:transparent}
thead .grp-tools{left:auto;right:2px;transform:none;border-radius:0 0 0 5px}
td.ctrl button[data-act="type"]{color:var(--blue2);font-weight:800}
body:not(.edit) .ctrl{display:none}
td.ctrl,th.ctrl{width:96px;white-space:nowrap;text-align:center;background:#fff;border-left:2px solid var(--line)}
td.ctrl button{padding:2px 5px;font-size:11px;margin:1px;text-transform:none}
[contenteditable="true"]:focus{outline:2px solid var(--hi);outline-offset:-2px}
body.edit tbody td[contenteditable]{cursor:text}
body.edit tbody td[contenteditable]:hover{background:#FFFBEF}
#tokPanel{display:none;position:fixed;top:56px;right:14px;z-index:120;width:314px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:0 14px 44px rgba(30,58,95,.24)}
#tokPanel h4{font-family:'Inter';font-weight:800;font-size:14px;margin:0 0 5px}
#tokPanel p{font-size:11.5px;color:var(--mute);line-height:1.55;margin:0 0 10px}
#tokPanel code{background:#EEF3F8;padding:1px 5px;border-radius:4px;font-size:11px}
#tokInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',monospace;font-size:12px;background:#F8FBFE}
#tokInput:focus{outline:none;border-color:var(--blue)}
.tp-row{display:flex;gap:6px;margin-top:9px}
#tokState{font-size:11px;margin-top:8px;color:var(--mute)}
@media print{.bar,.tip,.ctrl,.delcol,#tokPanel{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}.tbl-scroll{overflow:visible;border:none;box-shadow:none}
  table{min-width:0;font-size:10px}@page{size:A3 landscape;margin:8mm}}
</style>

/* ---------- state ---------- */
function fileData(){ try{ var el=document.getElementById('bg-data'); if(el){ var o=JSON.parse(el.textContent); if(o) return o; } }catch(e){} return {}; }
var FD=fileData(), baseSavedAt=(typeof FD.savedAt==='number')?FD.savedAt:0;
function published(){ return (FD&&FD.rows&&FD.rows.length)?FD:seed(); }
var S=null;
try{ var raw=localStorage.getItem(LSK); if(raw){ var ls=JSON.parse(raw); if(ls&&ls.rows&&(ls.savedAt||0)>=baseSavedAt) S=ls; } }catch(e){}
if(!S) S=published();
var sd=seed();
if(typeof S.savedAt!=='number') S.savedAt=baseSavedAt;
['fs','gpStart','gpCount','title','sub','gpLabel','cols'].forEach(function(k){ if(S[k]===undefined) S[k]=sd[k]; });
if(!S.fs) S.fs=1;

/* ---- โมเดลใหม่: หลายกลุ่มปี + คอลัมน์สูตร + แถวรวม (migrate จากรุ่นก่อน) ---- */
if(!Array.isArray(S.grp)) S.grp = S.cols.map(function(_,i){ return (S.gpCount>0 && i>=S.gpStart && i<S.gpStart+S.gpCount) ? (S.gpLabel||'GP') : ''; });
if(!Array.isArray(S.kind)) S.kind = S.cols.map(function(_,i){ return S.grp[i] ? 'num' : 'text'; });
if(!Array.isArray(S.calc)) S.calc = S.cols.map(function(){ return null; });
if(!Array.isArray(S.rtype)) S.rtype = S.rows.map(function(r){ var j=r.map(function(c){return _txt(c).toLowerCase();}); return j.indexOf('grand total')>=0?'grand':(j.indexOf('total')>=0?'sub':'data'); });
function _fixLens(){
  while(S.grp.length<S.cols.length) S.grp.push(''); S.grp.length=S.cols.length;
  while(S.kind.length<S.cols.length) S.kind.push('text'); S.kind.length=S.cols.length;
  while(S.calc.length<S.cols.length) S.calc.push(null); S.calc.length=S.cols.length;
  while(S.rtype.length<S.rows.length) S.rtype.push('data'); S.rtype.length=S.rows.length;
}
function _txt(html){ var d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }
_fixLens();

var editMode=true;
var tbl=document.getElementById('tbl'), tipEl=document.getElementById('tip'), saveEl=document.getElementById('autosave');
var hist=[], hi=-1, restoring=false, saveT=null;
function tip(m){ tipEl.textContent=m; tipEl.classList.add('show'); clearTimeout(tip._t); tip._t=setTimeout(function(){tipEl.classList.remove('show')},2400); }
function persistRaw(){ try{ localStorage.setItem(LSK,JSON.stringify(S)); saveEl.classList.add('hit'); setTimeout(function(){saveEl.classList.remove('hit')},450); }catch(e){ saveEl.textContent='● เก็บชั่วคราวไม่ได้'; } }
function recordHistory(){ if(restoring) return; var s=JSON.stringify(S); if(hi>=0&&hist[hi]===s) return; hist=hist.slice(0,hi+1); hist.push(s); hi=hist.length-1; if(hist.length>40){hist.shift();hi--;} updateUndo(); }
function persist(){ recordHistory(); persistRaw(); }
function schedulePersist(){ clearTimeout(saveT); saveT=setTimeout(persist,500); }
function updateUndo(){ var u=document.getElementById('bUndo'),r=document.getElementById('bRedo'); if(u)u.disabled=hi<=0; if(r)r.disabled=hi>=hist.length-1; }

var LEADCLS=['c-no','c-team','c-mgmt','c-dev','c-strat','c-unit'];
function colClass(c){ return S.grp[c] ? 'c-yr' : (c<LEADCLS.length ? LEADCLS[c] : 'c-extra'); }
/* ---- คำนวณ (สูตร/รวม) ---- */
function numOf(v){ var t=txt(v).replace(/,/g,'').trim(); if(t===''||t==='-') return NaN; var n=parseFloat(t); return isNaN(n)?NaN:n; }
function fmtNum(n){ if(!isFinite(n)) return ''; var r=Math.round(n*100)/100; return r.toLocaleString('en-US',{maximumFractionDigits:2}); }
function groupCols(label){ var o=[]; if(!label) return o; for(var i=0;i<S.cols.length;i++) if(S.grp[i]===label) o.push(i); return o; }
function groupPos(ci){ var g=S.grp[ci]; if(!g) return -1; return groupCols(g).indexOf(ci); }
function isNumCol(ci){ return S.kind[ci]==='num' || S.kind[ci]==='calc'; }
function rawNum(ri,ci){
  if(S.kind[ci]==='calc' && S.calc[ci]){ var sc=groupCols(S.calc[ci].src), sci=sc[groupPos(ci)]; if(sci===undefined) return NaN; var b=numOf(S.rows[ri][sci]); return isNaN(b)?NaN:b*(S.calc[ci].factor||0); }
  return numOf(S.rows[ri][ci]);
}
function blockDataRows(ri){ var o=[]; for(var k=ri-1;k>=0;k--){ if(S.rtype[k]!=='data') break; o.unshift(k); if(txt(S.rows[k][0])!=='') break; } return o; }
function allDataRows(){ var o=[]; for(var k=0;k<S.rows.length;k++) if(S.rtype[k]==='data') o.push(k); return o; }
function isComputed(ri,ci){ if(S.kind[ci]==='calc') return true; if(isNumCol(ci) && (S.rtype[ri]==='sub'||S.rtype[ri]==='grand')) return true; return false; }
function cellDisplay(ri,ci){
  var rt=S.rtype[ri];
  if(isNumCol(ci) && (rt==='sub'||rt==='grand')){
    var rows=(rt==='grand')?allDataRows():blockDataRows(ri), sum=0, any=false;
    rows.forEach(function(rr){ var v=rawNum(rr,ci); if(!isNaN(v)){ sum+=v; any=true; } });
    return any?fmtNum(sum):'';
  }
  if(S.kind[ci]==='calc'){ var v=rawNum(ri,ci); return isNaN(v)?'':fmtNum(v); }
  return S.rows[ri][ci]||'';
}
var recT=null;
function recomputeSoon(){ clearTimeout(recT); recT=setTimeout(recompute,220); }
function recompute(){ Array.prototype.slice.call(tbl.querySelectorAll('tbody td[data-ro]')).forEach(function(td){ td.innerHTML=cellDisplay(+td.dataset.r,+td.dataset.c); }); }
function defaultColW(i){ var cls=colClass(i); return cls==='c-no'?46:cls==='c-yr'?64:cls==='c-unit'?88:cls==='c-team'?150:(cls==='c-mgmt'||cls==='c-dev')?165:cls==='c-strat'?320:140; }
function colW(i){ return (S.colw&&S.colw[i])||defaultColW(i); }
function sumColw(){ var t=0; for(var i=0;i<S.cols.length;i++) t+=colW(i); return t; }
if(!Array.isArray(S.colw)) S.colw=[];
while(S.colw.length<S.cols.length) S.colw.push(defaultColW(S.colw.length));
S.colw.length=S.cols.length;
function delColBtn(i){ return editMode ? '<div class="th-tools"><button data-mv="-1" data-c="'+i+'" title="เลื่อนซ้าย">◀</button><button class="delcol" data-delcol="'+i+'" title="ลบคอลัมน์">✕</button><button data-mv="1" data-c="'+i+'" title="เลื่อนขวา">▶</button></div>' : ''; }
function txt(html){ var d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }

function grpTools(i){ return editMode ? '<div class="th-tools grp-tools"><button data-addyr="'+i+'" title="เพิ่มปีในกลุ่มนี้">＋ปี</button></div>' : ''; }
function render(){
  document.getElementById('hdTitle').textContent=S.title||'';
  document.getElementById('hdSub').textContent=S.sub||'';
  tbl.style.setProperty('--tfs', S.fs||1);
  var ce=editMode?'true':'false', n=S.cols.length;
  var rzH=function(i){ return '<div class="rz" data-rz="'+i+'" title="ลากขอบเพื่อปรับความกว้าง"></div>'; };
  var anyGroup=false; for(var g0=0;g0<n;g0++){ if(S.grp[g0]){ anyGroup=true; break; } }
  var h='<colgroup>';
  for(var cc=0;cc<n;cc++) h+='<col data-c="'+cc+'" style="width:'+colW(cc)+'px">';
  h+='<col style="width:100px"></colgroup><thead><tr>';
  var i=0;
  while(i<n){
    if(S.grp[i]){
      var gl=S.grp[i], span=1; while(i+span<n && S.grp[i+span]===gl) span++;
      h+='<th colspan="'+span+'" class="grp-h" style="text-align:center"><span class="hlabel" data-gpl="'+i+'" contenteditable="'+ce+'">'+gl+'</span>'+grpTools(i)+'</th>';
      i+=span;
    } else {
      h+='<th rowspan="'+(anyGroup?2:1)+'" class="'+colClass(i)+'"><span class="hlabel" data-col="'+i+'" contenteditable="'+ce+'">'+(S.cols[i]||'')+'</span>'+delColBtn(i)+rzH(i)+'</th>';
      i++;
    }
  }
  h+='<th rowspan="'+(anyGroup?2:1)+'" class="ctrl">จัดการ</th></tr>';
  if(anyGroup){ h+='<tr>'; for(var c2=0;c2<n;c2++){ if(S.grp[c2]) h+='<th class="'+colClass(c2)+'"><span class="hlabel" data-col="'+c2+'" contenteditable="'+ce+'">'+(S.cols[c2]||'')+'</span>'+delColBtn(c2)+rzH(c2)+'</th>'; } h+='</tr>'; }
  h+='</thead><tbody>';
  S.rows.forEach(function(row,ri){
    var isGrp=txt(row[0])!=='', rt=S.rtype[ri];
    var cls=((isGrp?'grp ':'')+(rt==='sub'?'total ':'')+(rt==='grand'?'grand ':'')).trim();
    h+='<tr class="'+cls+'" data-row="'+ri+'">';
    for(var c=0;c<n;c++){ var comp=isComputed(ri,c);
      h+='<td class="'+colClass(c)+(comp?' calc':'')+'" data-r="'+ri+'" data-c="'+c+'"'+(comp?' data-ro="1"':' contenteditable="'+ce+'"')+'>'+cellDisplay(ri,c)+'</td>'; }
    h+='<td class="ctrl">'+
       '<button data-act="type" data-r="'+ri+'" title="ชนิดแถว: ปกติ → รวมกลุ่ม → รวมทั้งหมด">Σ</button>'+
       '<button data-act="up" data-r="'+ri+'" title="ขึ้น">↑</button>'+
       '<button data-act="down" data-r="'+ri+'" title="ลง">↓</button>'+
       '<button data-act="ins" data-r="'+ri+'" title="แทรกใต้">＋</button>'+
       '<button data-act="del" data-r="'+ri+'" title="ลบแถว">✕</button></td></tr>';
  });
  h+='</tbody>'; tbl.innerHTML=h;
  tbl.style.width=(sumColw()+100)+'px';
}

/* read DOM back into S */
function setGroupLabel(gi,newL){ var oldL=S.grp[gi]; for(var q=gi;q<S.cols.length && S.grp[q]===oldL; q++) S.grp[q]=newL; if(S.gpLabel===oldL) S.gpLabel=newL; }
function syncAll(){
  tbl.querySelectorAll('tbody td[data-r]').forEach(function(td){ if(td.dataset.ro) return; if(S.rows[+td.dataset.r]) S.rows[+td.dataset.r][+td.dataset.c]=td.innerHTML; });
  tbl.querySelectorAll('.hlabel[data-col]').forEach(function(s){ S.cols[+s.dataset.col]=s.innerHTML; });
  tbl.querySelectorAll('.hlabel[data-gpl]').forEach(function(s){ setGroupLabel(+s.dataset.gpl, s.innerText); });
}

/* live edit */
tbl.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset && t.dataset.r!==undefined && t.dataset.c!==undefined){ if(t.dataset.ro) return; S.rows[+t.dataset.r][+t.dataset.c]=t.innerHTML; schedulePersist(); recomputeSoon(); }
  else if(t.classList && t.classList.contains('hlabel')){ if(t.dataset.col!==undefined) S.cols[+t.dataset.col]=t.innerHTML; else if(t.dataset.gpl!==undefined) setGroupLabel(+t.dataset.gpl, t.innerText); schedulePersist(); }
});

/* row + column controls */
tbl.addEventListener('click',function(e){
  var mvb=e.target.closest('button[data-mv]');
  if(mvb){ e.preventDefault(); moveColumn(+mvb.dataset.c, +mvb.dataset.mv); return; }
  var ay=e.target.closest('button[data-addyr]');
  if(ay){ e.preventDefault(); addYearToGroup(+ay.dataset.addyr); return; }
  var dc=e.target.closest('button[data-delcol]');
  if(dc){ e.preventDefault(); delColumn(+dc.dataset.delcol); return; }
  var b=e.target.closest('button[data-act]'); if(!b) return;
  syncAll(); var ri=+b.dataset.r, act=b.dataset.act;
  if(act==='del'){ if(S.rows.length>1 && confirm('ลบแถวนี้?')){ S.rows.splice(ri,1); S.rtype.splice(ri,1); } }
  else if(act==='ins'){ S.rows.splice(ri+1,0,blankRow()); S.rtype.splice(ri+1,0,'data'); }
  else if(act==='up'){ if(ri>0) swapRow(ri,ri-1); }
  else if(act==='down'){ if(ri<S.rows.length-1) swapRow(ri,ri+1); }
  else if(act==='type'){ S.rtype[ri]=(S.rtype[ri]==='data')?'sub':(S.rtype[ri]==='sub'?'grand':'data'); tip('แถวนี้: '+({data:'ปกติ',sub:'รวมกลุ่ม (Subtotal)',grand:'รวมทั้งหมด (Grand Total)'}[S.rtype[ri]])); }
  render(); persist();
});
function swapRow(a,b){ var t=S.rows[a]; S.rows[a]=S.rows[b]; S.rows[b]=t; var u=S.rtype[a]; S.rtype[a]=S.rtype[b]; S.rtype[b]=u; }
function blankRow(){ return new Array(S.cols.length).fill(''); }
function delColumn(i){
  if(S.cols.length<=1){ tip('ต้องมีอย่างน้อย 1 คอลัมน์'); return; }
  if(!confirm('ลบคอลัมน์ “'+txt(S.cols[i])+'” ทั้งคอลัมน์?')) return;
  syncAll();
  ['cols','colw','grp','kind','calc'].forEach(function(a){ S[a].splice(i,1); });
  S.rows.forEach(function(r){ r.splice(i,1); });
  render(); persist(); tip('ลบคอลัมน์แล้ว');
}
function moveColumn(i,dir){
  var j=i+dir; if(j<0||j>=S.cols.length) return;
  if((S.grp[i]||'')!==(S.grp[j]||'')){ tip('ย้ายได้ภายในกลุ่มเดียวกัน'); return; }
  syncAll();
  ['cols','colw','grp','kind','calc'].forEach(function(a){ var t=S[a][i]; S[a][i]=S[a][j]; S[a][j]=t; });
  S.rows.forEach(function(r){ var v=r[i]; r[i]=r[j]; r[j]=v; });
  render(); persist(); tip('สลับคอลัมน์แล้ว');
}
function insertColAt(at,label,grp,kind,calc,w){
  S.cols.splice(at,0,label); S.colw.splice(at,0,w||(kind==='text'?140:64));
  S.grp.splice(at,0,grp||''); S.kind.splice(at,0,kind||'text'); S.calc.splice(at,0,calc||null);
  S.rows.forEach(function(r){ r.splice(at,0,''); });
}
function addYearToGroup(gi){
  syncAll(); var label=S.grp[gi]; if(!label) return;
  var cols=groupCols(label), at=cols[cols.length-1]+1;
  var kind=S.kind[cols[0]], calc=S.calc[cols[0]]?{src:S.calc[cols[0]].src,factor:S.calc[cols[0]].factor}:null;
  insertColAt(at,'25xx',label,kind,calc,64);
  render(); persist(); tip('เพิ่มปีในกลุ่ม “'+txt(label)+'”');
}

document.getElementById('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} refreshTok(); tip('ลบ token แล้ว'); });

/* save to web (Git Data API) */
function encodeB64(str){ var bytes=new TextEncoder().encode(str),r='',ch=3*1024; for(var i=0;i<bytes.length;i+=ch){ var sl=bytes.subarray(i,i+ch),bin=''; for(var j=0;j<sl.length;j++)bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
var DATA_RE=/<!--BG_DATA_START-->[\s\S]*?<!--BG_DATA_END-->/;
function dataBlock(json){ return '<!--BG_DATA_START-->\n<script id="bg-data" type="application/json">'+json+'<\/script>\n<!--BG_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ openTok(); tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=document.getElementById('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  syncAll(); var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo;
  function gh(m,p,body,accept){ var h={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'}; var o={method:m,headers:h}; if(body!=null){ h['Content-Type']='application/json'; o.body=JSON.stringify(body); } return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var msg=''; try{ msg=(await res.json()).message||''; }catch(_){}
      throw new Error(label+' ('+res.status+(res.status===401?' — token ไม่ถูกต้อง':(res.status===403?' — token ไม่มีสิทธิ์':''))+') '+msg); } return res; }
  try{
    var rawRes=await gh('GET', base+'/contents/'+GH.file+'?ref='+GH.branch, null, 'application/vnd.github.raw'); await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST', base+'/git/blobs', {content:encodeB64(out), encoding:'base64'}); await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET', base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้'); var ref=await refRes.json(); var headSha=ref.object.sha;
    var hcRes=await gh('GET', base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST', base+'/git/trees', {base_tree:hc.tree.sha, tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}]}); await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST', base+'/git/commits', {message:'Business Generation update via browser ['+new Date().toISOString().slice(0,16)+']', tree:tree.sha, parents:[headSha]}); await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH', base+'/git/refs/heads/'+GH.branch, {sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persistRaw(); tip('✓ บันทึกขึ้นเว็บแล้ว — live ใน ~1 นาที · เปิดเครื่องไหนก็เห็น');
  }catch(e){ S.savedAt=prev; tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}
document.getElementById('bPublish').addEventListener('click',publish);

/* init */
render(); recordHistory(); updateUndo();
tip('แก้ไขได้ทุกช่อง · Undo/Redo (Ctrl+Z/Y) · เพิ่มแถว/คอลัมน์ได้ · กด “บันทึกขึ้นเว็บ” เพื่อ live');
})();
</script>
