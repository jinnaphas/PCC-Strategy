<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCC — Business Generation (3.1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F0F4F8; --card:#FFFFFF; --ink:#1E3A5F; --mute:#5A6E88; --line:#D3DEEA;
  --blue:#0077B6; --blue2:#005A8E; --orange:#F7941D; --green:#2E7D32; --hi:#F5B301;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 50% -12%,#FFFFFF 0%,transparent 60%),var(--paper);
  color:var(--ink);font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
h1{font-family:'Inter','Sarabun',sans-serif;margin:0}

/* toolbar */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  padding:9px 14px;background:rgba(240,244,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand b{font-family:'Inter';font-size:13px;font-weight:800;color:var(--blue2)}
.brand span{font-family:'Inter';font-size:8.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8FA3B8}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  background:#fff;color:#41566E;border:1px solid var(--line);padding:6px 10px;cursor:pointer;border-radius:6px;white-space:nowrap;transition:.14s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.pub{background:var(--blue2);border-color:var(--blue2);color:#fff}
button.pub:hover{background:#00466f;border-color:#00466f;color:#fff}
button:disabled{opacity:.55;cursor:default}
a.back{font-family:'Inter';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  text-decoration:none;color:#41566E;border:1px solid var(--line);padding:6px 10px;border-radius:6px}
a.back:hover{border-color:var(--blue);color:var(--blue)}
#autosave{font-family:'Inter';font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#B7C4D2;margin-left:auto;transition:color .25s}
#autosave.hit{color:var(--green)}
.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 22px rgba(30,58,95,.25)}
.tip.show{opacity:.96}

/* header block */
.wrap{max-width:1680px;margin:0 auto;padding:20px 16px 90px}
.hd-title{font-size:22px;font-weight:800;color:var(--blue2);margin:0 0 2px}
.hd-sub{font-size:12.5px;color:var(--mute);margin:0 0 16px}

/* table */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 18px rgba(30,58,95,.07);background:#fff}
table{border-collapse:collapse;width:100%;min-width:1200px;font-size:13px}
thead th{background:var(--blue2);color:#fff;font-family:'Inter','Sarabun',sans-serif;font-weight:700;font-size:12px;
  padding:8px 10px;text-align:left;vertical-align:middle;border:1px solid #14496e}
thead tr:nth-child(2) th{background:#0a5b8c}
tbody td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;white-space:pre-wrap;line-height:1.45;color:#26384d}
tbody tr:hover td{background:#F7FBFE}
td.c-no{width:38px;text-align:center;font-weight:800;color:var(--blue2)}
td.c-unit{width:78px;font-weight:600}
td.c-yr{width:56px;text-align:right;font-variant-numeric:tabular-nums}
th.c-yr{text-align:right;width:56px}
.c-team{min-width:130px;font-weight:700;color:var(--blue2)}
.c-mgmt,.c-dev{min-width:150px}
.c-strat{min-width:320px}
/* RST group start row */
tbody tr.grp td{border-top:2px solid var(--blue2)}
tbody tr.total td{background:#EAF3FA;font-weight:800}
tbody tr.total td.c-unit{color:var(--blue2)}
/* edit mode */
body:not(.edit) .ctrl{display:none}
td.ctrl,th.ctrl{width:96px;white-space:nowrap;text-align:center;background:#fff;border-left:2px solid var(--line)}
td.ctrl button{padding:2px 6px;font-size:11px;margin:1px}
[contenteditable="true"]:focus{outline:2px solid var(--hi);outline-offset:-2px;background:#FFFDF4}
body.edit tbody td[contenteditable]{cursor:text}
body.edit tbody td[contenteditable]:hover{background:#FFFBEF}

/* token panel */
#tokPanel{display:none;position:fixed;top:56px;right:14px;z-index:120;width:314px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:0 14px 44px rgba(30,58,95,.24)}
#tokPanel h4{font-family:'Inter';font-weight:800;font-size:14px;margin:0 0 5px}
#tokPanel p{font-size:11.5px;color:var(--mute);line-height:1.55;margin:0 0 10px}
#tokPanel code{background:#EEF3F8;padding:1px 5px;border-radius:4px;font-size:11px}
#tokInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',monospace;font-size:12px;background:#F8FBFE}
#tokInput:focus{outline:none;border-color:var(--blue)}
.tp-row{display:flex;gap:6px;margin-top:9px}
#tokState{font-size:11px;margin-top:8px;color:var(--mute)}

@media print{
  .bar,.tip,.ctrl,#tokPanel{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .tbl-scroll{overflow:visible;border:none;box-shadow:none}
  thead th{position:static}
  table{min-width:0;font-size:10px}
  @page{size:A3 landscape;margin:8mm}
}
</style>
</head>
<body class="edit">

<!--BG_DATA_START-->
<script id="bg-data" type="application/json">{"savedAt":0}</script>
<!--BG_DATA_END-->

<div class="bar">
  <div class="brand"><b>Business Generation</b><span>3.1 · PCC Strategy</span></div>
  <a class="back" href="strategy-mapping.html" title="กลับหน้า Strategy Mapping">↩ Strategy Mapping</a>
  <div class="sep"></div>
  <button id="bEdit" class="on">✎ แก้ไข</button>
  <button id="bAddRow">+ เพิ่มแถว</button>
  <div class="sep"></div>
  <button id="bPublish" class="pub">💾 บันทึกขึ้นเว็บ</button>
  <button id="bTok" title="ตั้งค่า GitHub token">⚙️</button>
  <div class="sep"></div>
  <button id="bSave">บันทึกไฟล์</button>
  <button id="bOpen">เปิดไฟล์</button>
  <button id="bPrint">พิมพ์ / PDF</button>
  <span id="autosave">● บันทึกอัตโนมัติ</span>
</div>

<div id="tokPanel">
  <h4>GitHub Token (PAT)</h4>
  <p>ใช้สำหรับ <b>บันทึกขึ้นเว็บ</b> · เก็บในเบราว์เซอร์นี้ (<code>pcc_gh_tok</code>) · ตัวเดียวกับหน้า Strategy Mapping · ต้องมีสิทธิ์ <b>repo / contents write</b></p>
  <input id="tokInput" type="password" placeholder="ghp_xxxxxxxx" autocomplete="off" spellcheck="false">
  <div class="tp-row"><button id="tokSave" class="pub">บันทึก token</button><button id="tokClear">ลบ token</button><button id="tokClose">ปิด</button></div>
  <div id="tokState"></div>
</div>

<div class="wrap">
  <h1 class="hd-title" id="hdTitle" contenteditable="true"></h1>
  <p class="hd-sub" id="hdSub" contenteditable="true"></p>
  <div class="tbl-scroll"><table id="tbl"></table></div>
</div>

<div class="tip" id="tip"></div>

<script>
(function(){
"use strict";
var LSK='pcc_bg_v1';
var GH={owner:'jinnaphas',repo:'PCC-Strategy',branch:'main',api:'https://api.github.com',file:'business-generation.html'};

/* ---------- default data (draft ของผู้ใช้) ---------- */
function seed(){ return {
  savedAt:0,
  title:'Mission Statement: Business Generation',
  sub:'3.1 Business Generation · ภารกิจเป้าหมายของ Management Team (GP) หน่วย: ล้านบาท · แก้ไขได้ทุกช่อง แล้วกด “บันทึกขึ้นเว็บ”',
  gpLabel:'ภารกิจเป้าหมายของ Management Team (GP)',
  cols:['No','Team','Management Team','Platform Dev Team','Strategy: Core Product Distinctive Competencies and TRM (กวาดนอกเหนือจาก Existing)','Unit','2570','2571','2572','2573'],
  rows:[
    ['1','Tendering RST','คุณภาสกร. คุณภัทราวุธ','PSP - ปอ, ไอซ์\nPEM - ตาล','ตั้งที่ ปอ ทำ Tendering 1 หน่วยงานใน สำหรับ Product Scope ใหม่ Interopability Layer ใน Digital Architecture Model ทั้ง 4 (SGAM, SFAM, SCIAM, RAMI4.0)','PSP','30','50','70','90'],
    ['','','คุณภาสกร. คุณภัทราวุธ','PSP - ปอ, ไอซ์\nPEM - ตาล','Platform AI ในการ Collect Enquiry In, Budgeting และสามารถดำเนินการตาม TOR ได้อัตโนมัติ และสร้าง Proposal ได้อัตโนมัติ','','','','',''],
    ['2','Omni Channel RST','คุณภัทราวุธ, คุณโม้ย, คุณเก๋, คุณกิ๊ก','คุณปุ๊ก','Sale Forecast by\n1. Product Scope (จำนวน Product List (Existing, New))\n2. Channel Members\n3. Infrastructure รองรับ Sale Growth\n4. One Stop Service, Fast Responsiveness (Stock and Shipment Overnight)','PEM','360','400','430','450'],
    ['3','TCS','อุ๊บอิ๊บ, กุ้ง / คุณแอ๊ด, คุณโก้, คุณณัฐวุฒิ, BM','อุ๊บอิ๊บ, เบส, แพรวรุ่ง','กวาดแยกตามชื่อลูกค้า','PSP','90','125','150',''],
    ['','','','','','PEM104','20','25','30',''],
    ['','','','','','PEM105','40','55','70',''],
    ['','','','','','PCE','20','25','50',''],
    ['','','','','','Total','170','230','300',''],
    ['4','Recurring','คุณวิชัย, คุณเศกสรร, หนุ่ย ท๊อป, พีค','หญิง, New BA, แอ๊ม (Digital Twin), แพรวรุ่ง','','','','','',''],
    ['5','PPA / Long Term','คุณอมร. เฟย์, จุ๊บแจง, อ๊อฟ','เฟย์, เติ๊ด, บอล, ตุลา, พอลล่า','','','','','',''],
    ['6','Investment in Other Industries','คุณกาญ, จิ๊ก','น้ำ','','PCC','10','20','30','40']
  ]
};}

/* ---------- state ---------- */
function fileData(){ try{ var el=document.getElementById('bg-data'); if(el){ var o=JSON.parse(el.textContent); if(o) return o; } }catch(e){} return {}; }
var FD=fileData(), baseSavedAt=(typeof FD.savedAt==='number')?FD.savedAt:0;
function published(){ return (FD&&FD.rows&&FD.rows.length)?FD:seed(); }
var S=null;
try{ var raw=localStorage.getItem(LSK); if(raw){ var ls=JSON.parse(raw); if(ls&&ls.rows&&(ls.savedAt||0)>=baseSavedAt) S=ls; } }catch(e){}
if(!S) S=published();
var sd=seed();
if(typeof S.savedAt!=='number') S.savedAt=baseSavedAt;
if(!Array.isArray(S.cols)) S.cols=sd.cols;
if(!S.gpLabel) S.gpLabel=sd.gpLabel;
if(!S.title) S.title=sd.title;
if(!S.sub) S.sub=sd.sub;

var editMode=true, NC=S.cols.length;
var tbl=document.getElementById('tbl'), tipEl=document.getElementById('tip'), saveEl=document.getElementById('autosave');
function tip(m){ tipEl.textContent=m; tipEl.classList.add('show'); clearTimeout(tip._t); tip._t=setTimeout(function(){tipEl.classList.remove('show')},2400); }

var saveT=null;
function persistRaw(){ try{ localStorage.setItem(LSK, JSON.stringify(S)); saveEl.classList.add('hit'); setTimeout(function(){saveEl.classList.remove('hit')},450); }catch(e){ saveEl.textContent='● เก็บชั่วคราวไม่ได้'; } }
function schedulePersist(){ clearTimeout(saveT); saveT=setTimeout(persistRaw,450); }
function esc(s){ return (s==null?'':(''+s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var CLS=['c-no','c-team','c-mgmt','c-dev','c-strat','c-unit','c-yr','c-yr','c-yr','c-yr'];
function render(){
  document.getElementById('hdTitle').textContent=S.title||'';
  document.getElementById('hdSub').textContent=S.sub||'';
  var ce=editMode?'true':'false';
  var h='<thead><tr>';
  for(var i=0;i<6;i++) h+='<th rowspan="2" class="'+CLS[i]+'" data-col="'+i+'" contenteditable="'+ce+'">'+esc(S.cols[i])+'</th>';
  h+='<th colspan="4" data-gp="1" contenteditable="'+ce+'" style="text-align:center">'+esc(S.gpLabel)+'</th>';
  h+='<th rowspan="2" class="ctrl">จัดการ</th></tr><tr>';
  for(var y=6;y<10;y++) h+='<th class="c-yr" data-col="'+y+'" contenteditable="'+ce+'">'+esc(S.cols[y])+'</th>';
  h+='</tr></thead><tbody>';
  S.rows.forEach(function(row,ri){
    var isGrp = (row[0]||'').trim()!=='';
    var isTot = (row[5]||'').trim().toLowerCase()==='total';
    h+='<tr class="'+(isGrp?'grp ':'')+(isTot?'total':'')+'" data-row="'+ri+'">';
    for(var c=0;c<10;c++) h+='<td class="'+CLS[c]+'" data-r="'+ri+'" data-c="'+c+'" contenteditable="'+ce+'">'+esc(row[c])+'</td>';
    h+='<td class="ctrl">'+
        '<button data-act="up" data-r="'+ri+'" title="เลื่อนขึ้น">↑</button>'+
        '<button data-act="down" data-r="'+ri+'" title="เลื่อนลง">↓</button>'+
        '<button data-act="ins" data-r="'+ri+'" title="แทรกแถวใต้">＋</button>'+
        '<button data-act="del" data-r="'+ri+'" title="ลบแถว">✕</button></td>';
    h+='</tr>';
  });
  h+='</tbody>';
  tbl.innerHTML=h;
}

/* edit cells (delegated) */
tbl.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.r!==undefined && t.dataset.c!==undefined){ S.rows[+t.dataset.r][+t.dataset.c]=t.innerText; schedulePersist(); }
  else if(t.dataset.col!==undefined){ S.cols[+t.dataset.col]=t.innerText; schedulePersist(); }
  else if(t.dataset.gp!==undefined){ S.gpLabel=t.innerText; schedulePersist(); }
});
document.getElementById('hdTitle').addEventListener('input',function(){ S.title=this.innerText; schedulePersist(); });
document.getElementById('hdSub').addEventListener('input',function(){ S.sub=this.innerText; schedulePersist(); });

/* row controls */
function syncRows(){ /* read DOM back into S before structural change */
  tbl.querySelectorAll('tbody td[data-r]').forEach(function(td){ S.rows[+td.dataset.r][+td.dataset.c]=td.innerText; });
}
tbl.addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]'); if(!b) return;
  syncRows();
  var ri=+b.dataset.r, act=b.dataset.act;
  if(act==='del'){ if(S.rows.length>1 && confirm('ลบแถวนี้?')){ S.rows.splice(ri,1); } }
  else if(act==='ins'){ S.rows.splice(ri+1,0, new Array(10).fill('')); }
  else if(act==='up'){ if(ri>0){ var t=S.rows[ri-1]; S.rows[ri-1]=S.rows[ri]; S.rows[ri]=t; } }
  else if(act==='down'){ if(ri<S.rows.length-1){ var t2=S.rows[ri+1]; S.rows[ri+1]=S.rows[ri]; S.rows[ri]=t2; } }
  render(); persistRaw();
});
document.getElementById('bAddRow').addEventListener('click',function(){ syncRows(); S.rows.push(new Array(10).fill('')); render(); persistRaw(); tip('เพิ่มแถวแล้ว'); });

/* edit toggle */
document.getElementById('bEdit').addEventListener('click',function(){
  editMode=!editMode; this.classList.toggle('on',editMode); document.body.classList.toggle('edit',editMode);
  render(); tip(editMode?'แก้ไขได้':'ล็อกการแก้ไขแล้ว');
});

/* ---------- JSON save / open ---------- */
document.getElementById('bSave').addEventListener('click',function(){
  syncRows();
  var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='PCC_Business_Generation.json'; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000); tip('บันทึกไฟล์แล้ว');
});
var fo=document.createElement('input'); fo.type='file'; fo.accept='application/json,.json'; fo.style.display='none'; document.body.appendChild(fo);
document.getElementById('bOpen').addEventListener('click',function(){ fo.click(); });
fo.addEventListener('change',function(){ var f=fo.files[0]; if(!f) return; var fr=new FileReader();
  fr.onload=function(e){ try{ var o=JSON.parse(e.target.result); if(!o.rows) throw 0; S=o; if(!S.cols) S.cols=seed().cols; render(); persistRaw(); tip('เปิดไฟล์แล้ว'); }catch(err){ tip('ไฟล์ไม่ถูกต้อง'); } fo.value=''; };
  fr.readAsText(f); });

document.getElementById('bPrint').addEventListener('click',function(){ window.print(); });

/* ---------- token ---------- */
var tokPanel=document.getElementById('tokPanel'), tokInput=document.getElementById('tokInput'), tokState=document.getElementById('tokState');
function tokGet(){ try{ return (localStorage.getItem('pcc_gh_tok')||'').trim(); }catch(e){ return ''; } }
function refreshTok(){ var t=tokGet(); tokState.textContent=t?('● มี token แล้ว ('+t.slice(0,4)+'…'+t.slice(-3)+')'):'○ ยังไม่มี token'; tokState.style.color=t?'var(--green)':'#B0392B'; }
function openTok(){ tokPanel.style.display='block'; tokInput.value=''; refreshTok(); setTimeout(function(){tokInput.focus();},30); }
document.getElementById('bTok').addEventListener('click',function(){ tokPanel.style.display==='block'?(tokPanel.style.display='none'):openTok(); });
document.getElementById('tokClose').addEventListener('click',function(){ tokPanel.style.display='none'; });
document.getElementById('tokSave').addEventListener('click',function(){ var v=(tokInput.value||'').trim(); if(!v){ tip('ยังไม่ได้พิมพ์ token'); return; } try{ localStorage.setItem('pcc_gh_tok',v); refreshTok(); tip('เก็บ token แล้ว'); }catch(e){ tip('เก็บไม่ได้'); } tokInput.value=''; });
document.getElementById('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} refreshTok(); tip('ลบ token แล้ว'); });

/* ---------- save to web (Git Data API — รองรับไฟล์ใหญ่) ---------- */
function encodeB64(str){ var bytes=new TextEncoder().encode(str),r='',ch=3*1024; for(var i=0;i<bytes.length;i+=ch){ var sl=bytes.subarray(i,i+ch),bin=''; for(var j=0;j<sl.length;j++)bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
var DATA_RE=/<!--BG_DATA_START-->[\s\S]*?<!--BG_DATA_END-->/;
function dataBlock(json){ return '<!--BG_DATA_START-->\n<script id="bg-data" type="application/json">'+json+'<\/script>\n<!--BG_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ openTok(); tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=document.getElementById('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  syncRows(); var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo;
  function gh(m,p,body,accept){ var h={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'}; var o={method:m,headers:h}; if(body!=null){ h['Content-Type']='application/json'; o.body=JSON.stringify(body); } return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var msg=''; try{ msg=(await res.json()).message||''; }catch(_){}
      throw new Error(label+' ('+res.status+(res.status===401?' — token ไม่ถูกต้อง':(res.status===403?' — token ไม่มีสิทธิ์':''))+') '+msg); } return res; }
  try{
    var rawRes=await gh('GET', base+'/contents/'+GH.file+'?ref='+GH.branch, null, 'application/vnd.github.raw');
    await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST', base+'/git/blobs', {content:encodeB64(out), encoding:'base64'}); await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET', base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้'); var ref=await refRes.json(); var headSha=ref.object.sha;
    var hcRes=await gh('GET', base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST', base+'/git/trees', {base_tree:hc.tree.sha, tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}]}); await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST', base+'/git/commits', {message:'Business Generation update via browser ['+new Date().toISOString().slice(0,16)+']', tree:tree.sha, parents:[headSha]}); await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH', base+'/git/refs/heads/'+GH.branch, {sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persistRaw(); tip('✓ บันทึกขึ้นเว็บแล้ว — live ใน ~1 นาที · เปิดเครื่องไหนก็เห็น');
  }catch(e){ S.savedAt=prev; tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}
document.getElementById('bPublish').addEventListener('click',publish);

/* init */
render();
tip('แก้ไขได้ทุกช่อง · งานบันทึกอัตโนมัติในเบราว์เซอร์ · กด “บันทึกขึ้นเว็บ” เพื่อ live ทุกเครื่อง');
})();
</script>
