while(S.colw.length<S.cols.length) S.colw.push(defaultColW(S.colw.length));

function delColBtn(i){ return editMode ? '<div class="th-tools"><button data-mv="-1" data-c="'+i+'" title="เลื่อนซ้าย">◀</button><button class="delcol" data-delcol="'+i+'" title="ลบคอลัมน์">✕</button><button data-mv="1" data-c="'+i+'" title="เลื่อนขวา">▶</button></div>' : ''; }
function txt(html){ var d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }

function render(){
  document.getElementById('hdTitle').textContent=S.title||'';
  document.getElementById('hdSub').textContent=S.sub||'';
  tbl.style.setProperty('--tfs', S.fs||1);
  var ce=editMode?'true':'false', gs=S.gpStart, gc=S.gpCount, n=S.cols.length;
  var rzH=function(i){ return '<div class="rz" data-rz="'+i+'" title="ลากขอบเพื่อปรับความกว้าง"></div>'; };
  var h='<colgroup>';
  for(var cc=0;cc<n;cc++) h+='<col data-c="'+cc+'" style="width:'+colW(cc)+'px">';
  h+='<col style="width:100px"></colgroup><thead><tr>';
  for(var i=0;i<gs && i<n;i++) h+='<th rowspan="'+(gc>0?2:1)+'" class="'+colClass(i)+'"><span class="hlabel" data-col="'+i+'" contenteditable="'+ce+'">'+(S.cols[i]||'')+'</span>'+delColBtn(i)+rzH(i)+'</th>';
  if(gc>0) h+='<th colspan="'+gc+'" style="text-align:center"><span class="hlabel" data-gp="1" contenteditable="'+ce+'">'+(S.gpLabel||'')+'</span></th>';
  for(var i2=gs+gc;i2<n;i2++) h+='<th rowspan="'+(gc>0?2:1)+'" class="'+colClass(i2)+'"><span class="hlabel" data-col="'+i2+'" contenteditable="'+ce+'">'+(S.cols[i2]||'')+'</span>'+delColBtn(i2)+rzH(i2)+'</th>';
  h+='<th rowspan="'+(gc>0?2:1)+'" class="ctrl">จัดการ</th></tr>';
  if(gc>0){ h+='<tr>'; for(var y=gs;y<gs+gc;y++) h+='<th class="c-yr"><span class="hlabel" data-col="'+y+'" contenteditable="'+ce+'">'+(S.cols[y]||'')+'</span>'+delColBtn(y)+rzH(y)+'</th>'; h+='</tr>'; }
  h+='</thead><tbody>';
  S.rows.forEach(function(row,ri){
    var isGrp=txt(row[0])!=='';
    var isTot=false; for(var k=0;k<gs;k++){ if(txt(row[k]).toLowerCase()==='total'){ isTot=true; break; } }
    h+='<tr class="'+(isGrp?'grp ':'')+(isTot?'total':'')+'" data-row="'+ri+'">';
    for(var c=0;c<n;c++) h+='<td class="'+colClass(c)+'" data-r="'+ri+'" data-c="'+c+'" contenteditable="'+ce+'">'+(row[c]||'')+'</td>';
    h+='<td class="ctrl">'+
       '<button data-act="up" data-r="'+ri+'" title="ขึ้น">↑</button>'+
       '<button data-act="down" data-r="'+ri+'" title="ลง">↓</button>'+
       '<button data-act="ins" data-r="'+ri+'" title="แทรกใต้">＋</button>'+
       '<button data-act="del" data-r="'+ri+'" title="ลบแถว">✕</button></td></tr>';
  });
  h+='</tbody>'; tbl.innerHTML=h;
  tbl.style.width=(sumColw()+100)+'px';
}

/* read DOM back into S */
function syncAll(){
  tbl.querySelectorAll('tbody td[data-r]').forEach(function(td){ if(S.rows[+td.dataset.r]) S.rows[+td.dataset.r][+td.dataset.c]=td.innerHTML; });
  tbl.querySelectorAll('.hlabel[data-col]').forEach(function(s){ S.cols[+s.dataset.col]=s.innerHTML; });
  var gp=tbl.querySelector('.hlabel[data-gp]'); if(gp) S.gpLabel=gp.innerHTML;
}

/* live edit */
tbl.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset && t.dataset.r!==undefined && t.dataset.c!==undefined){ S.rows[+t.dataset.r][+t.dataset.c]=t.innerHTML; schedulePersist(); }
  else if(t.classList && t.classList.contains('hlabel')){ if(t.dataset.col!==undefined) S.cols[+t.dataset.col]=t.innerHTML; else if(t.dataset.gp!==undefined) S.gpLabel=t.innerHTML; schedulePersist(); }
});
document.getElementById('hdTitle').addEventListener('input',function(){ S.title=this.innerText; schedulePersist(); });
document.getElementById('hdSub').addEventListener('input',function(){ S.sub=this.innerText; schedulePersist(); });

/* row + column controls */
tbl.addEventListener('click',function(e){
  var mvb=e.target.closest('button[data-mv]');
  if(mvb){ e.preventDefault(); moveColumn(+mvb.dataset.c, +mvb.dataset.mv); return; }
  var dc=e.target.closest('button[data-delcol]');
  if(dc){ e.preventDefault(); delColumn(+dc.dataset.delcol); return; }
  var b=e.target.closest('button[data-act]'); if(!b) return;
  syncAll(); var ri=+b.dataset.r, act=b.dataset.act;
  if(act==='del'){ if(S.rows.length>1 && confirm('ลบแถวนี้?')) S.rows.splice(ri,1); }
  else if(act==='ins'){ S.rows.splice(ri+1,0,blankRow()); }
  else if(act==='up'){ if(ri>0){ var t=S.rows[ri-1]; S.rows[ri-1]=S.rows[ri]; S.rows[ri]=t; } }
  else if(act==='down'){ if(ri<S.rows.length-1){ var t2=S.rows[ri+1]; S.rows[ri+1]=S.rows[ri]; S.rows[ri]=t2; } }
  render(); persist();
});
function blankRow(){ return new Array(S.cols.length).fill(''); }
function delColumn(i){
  if(S.cols.length<=1){ tip('ต้องมีอย่างน้อย 1 คอลัมน์'); return; }
  if(!confirm('ลบคอลัมน์ “'+txt(S.cols[i])+'” ทั้งคอลัมน์?')) return;
  syncAll();
  S.cols.splice(i,1); S.colw.splice(i,1); S.rows.forEach(function(r){ r.splice(i,1); });
  if(i<S.gpStart) S.gpStart--; else if(i<S.gpStart+S.gpCount) S.gpCount=Math.max(0,S.gpCount-1);
  render(); persist(); tip('ลบคอลัมน์แล้ว');
}
function moveColumn(i,dir){
  var j=i+dir; if(j<0||j>=S.cols.length) return;
  var gs=S.gpStart, ge=S.gpStart+S.gpCount;
  function region(k){ return k<gs?0:(k<ge?1:2); }
  if(S.gpCount>0 && region(i)!==region(j)){ tip('คอลัมน์ปีในกลุ่ม GP ย้ายข้ามกลุ่มไม่ได้'); return; }
  syncAll();
  var t=S.cols[i]; S.cols[i]=S.cols[j]; S.cols[j]=t;
  if(S.colw){ var w=S.colw[i]; S.colw[i]=S.colw[j]; S.colw[j]=w; }
  S.rows.forEach(function(r){ var v=r[i]; r[i]=r[j]; r[j]=v; });
  render(); persist(); tip('สลับคอลัมน์แล้ว'); }
document.getElementById('bAddRow').addEventListener('click',function(){ syncAll(); S.rows.push(blankRow()); render(); persist(); tip('เพิ่มแถวแล้ว'); });
document.getElementById('bAddCol').addEventListener('click',function(){ syncAll(); S.cols.push('คอลัมน์ใหม่'); S.colw.push(140); S.rows.forEach(function(r){ r.push(''); }); render(); persist(); tip('เพิ่มคอลัมน์แล้ว (แก้หัวคอลัมน์ได้)'); });
document.getElementById('bAddYear').addEventListener('click',function(){ syncAll(); var at=S.gpStart+S.gpCount; S.cols.splice(at,0,'25xx'); S.colw.splice(at,0,64); S.rows.forEach(function(r){ r.splice(at,0,''); }); S.gpCount++; render(); persist(); tip('เพิ่มคอลัมน์ปีในกลุ่ม GP แล้ว'); });

/* column resize (ลากปรับความกว้าง) */
var rzDrag=null;
tbl.addEventListener('mousedown',function(e){ var h=e.target.closest('.rz'); if(!h) return; e.preventDefault(); e.stopPropagation(); var i=+h.dataset.rz; rzDrag={i:i,sx:e.clientX,w0:colW(i)}; document.body.style.cursor='col-resize'; });
window.addEventListener('mousemove',function(e){ if(!rzDrag) return; var w=Math.max(30, rzDrag.w0+(e.clientX-rzDrag.sx)); S.colw[rzDrag.i]=w; var col=tbl.querySelector('col[data-c="'+rzDrag.i+'"]'); if(col) col.style.width=w+'px'; tbl.style.width=(sumColw()+100)+'px'; });
window.addEventListener('mouseup',function(){ if(!rzDrag) return; rzDrag=null; document.body.style.cursor=''; persist(); });

/* font size + text formatting */
function setFs(v){ S.fs=Math.round(Math.min(1.8,Math.max(.7,v))*100)/100; tbl.style.setProperty('--tfs',S.fs); persist(); tip('ขนาดตัวอักษร '+Math.round(S.fs*100)+'%'); }
document.getElementById('fsUp').addEventListener('click',function(){ setFs((S.fs||1)+.1); });
document.getElementById('fsDn').addEventListener('click',function(){ setFs((S.fs||1)-.1); });
function inTbl(node){ node=node&&(node.nodeType===1?node:node.parentNode); return !!(node&&tbl.contains(node)); }
function fmt(cmd,val){
  if(!editMode){ tip('เปิด “✎ แก้ไข” ก่อน'); return; }
  var s=window.getSelection();
  if(!(s&&s.rangeCount&&!s.isCollapsed&&inTbl(s.anchorNode))){ tip('ลากคลุมข้อความในช่องก่อน'); return; }
  document.execCommand('styleWithCSS',false,true);
  document.execCommand(cmd,false,val||null);
  syncAll(); persist();
}
document.getElementById('fmtB').addEventListener('click',function(){ fmt('bold'); });
document.getElementById('fmtI').addEventListener('click',function(){ fmt('italic'); });
document.querySelectorAll('.sw[data-tc]').forEach(function(b){ b.addEventListener('click',function(){ fmt('foreColor', b.getAttribute('data-tc')); }); });
document.getElementById('txtColor').addEventListener('input',function(){ fmt('foreColor', this.value); });

/* undo / redo */
function loadState(json){ restoring=true; S=JSON.parse(json); render(); persistRaw(); restoring=false; updateUndo(); }
function undo(){ if(hi>0){ hi--; loadState(hist[hi]); tip('ย้อนกลับแล้ว'); } else tip('ไม่มีให้ย้อน'); }
function redo(){ if(hi<hist.length-1){ hi++; loadState(hist[hi]); tip('ทำซ้ำแล้ว'); } else tip('ไม่มีให้ทำซ้ำ'); }
document.getElementById('bUndo').addEventListener('click',undo);
document.getElementById('bRedo').addEventListener('click',redo);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){ e.preventDefault(); redo(); }
});

/* edit toggle */
document.getElementById('bEdit').addEventListener('click',function(){
  syncAll(); editMode=!editMode; this.classList.toggle('on',editMode); document.body.classList.toggle('edit',editMode);
  render(); tip(editMode?'แก้ไขได้':'ล็อกแล้ว');
});

/* JSON save / open */
document.getElementById('bSave').addEventListener('click',function(){ syncAll(); var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='PCC_Business_Generation.json'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000); tip('บันทึกไฟล์แล้ว'); });
var fo=document.createElement('input'); fo.type='file'; fo.accept='application/json,.json'; fo.style.display='none'; document.body.appendChild(fo);
document.getElementById('bOpen').addEventListener('click',function(){ fo.click(); });
fo.addEventListener('change',function(){ var f=fo.files[0]; if(!f) return; var fr=new FileReader(); fr.onload=function(e){ try{ var o=JSON.parse(e.target.result); if(!o.rows) throw 0; S=o; if(!S.fs)S.fs=1; if(S.gpStart===undefined)S.gpStart=6; if(S.gpCount===undefined)S.gpCount=4; render(); persist(); tip('เปิดไฟล์แล้ว'); }catch(err){ tip('ไฟล์ไม่ถูกต้อง'); } fo.value=''; }; fr.readAsText(f); });
document.getElementById('bPrint').addEventListener('click',function(){ window.print(); });

/* token */
var tokPanel=document.getElementById('tokPanel'), tokInput=document.getElementById('tokInput'), tokState=document.getElementById('tokState');
function tokGet(){ try{ return (localStorage.getItem('pcc_gh_tok')||'').trim(); }catch(e){ return ''; } }
function refreshTok(){ var t=tokGet(); tokState.textContent=t?('● มี token แล้ว ('+t.slice(0,4)+'…'+t.slice(-3)+')'):'○ ยังไม่มี token'; tokState.style.color=t?'var(--green)':'#B0392B'; }
function openTok(){ tokPanel.style.display='block'; tokInput.value=''; refreshTok(); setTimeout(function(){tokInput.focus();},30); }
document.getElementById('bTok').addEventListener('click',function(){ tokPanel.style.display==='block'?(tokPanel.style.display='none'):openTok(); });
document.getElementById('tokClose').addEventListener('click',function(){ tokPanel.style.display='none'; });
document.getElementById('tokSave').addEventListener('click',function(){ var v=(tokInput.value||'').trim(); if(!v){ tip('ยังไม่ได้พิมพ์ token'); return; } try{ localStorage.setItem('pcc_gh_tok',v); refreshTok(); tip('เก็บ token แล้ว'); }catch(e){ tip('เก็บไม่ได้'); } tokInput.value=''; });
document.getElementById('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} refreshTok(); tip('ลบ token แล้ว'); });

/* save to web (Git Data API) */
function encodeB64(str){ var bytes=new TextEncoder().encode(str),r='',ch=3*1024; for(var i=0;i<bytes.length;i+=ch){ var sl=bytes.subarray(i,i+ch),bin=''; for(var j=0;j<sl.length;j++)bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
var DATA_RE=/<!--BG_DATA_START-->[\s\S]*?<!--BG_DATA_END-->/;
function dataBlock(json){ return '<!--BG_DATA_START-->\n<script id="bg-data" type="application/json">'+json+'<\/script>\n<!--BG_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ openTok(); tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=document.getElementById('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  syncAll(); var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo;
  function gh(m,p,body,accept){ var h={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'}; var o={method:m,headers:h}; if(body!=null){ h['Content-Type']='application/json'; o.body=JSON.stringify(body); } return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var msg=''; try{ msg=(await res.json()).message||''; }catch(_){}
      throw new Error(label+' ('+res.status+(res.status===401?' — token ไม่ถูกต้อง':(res.status===403?' — token ไม่มีสิทธิ์':''))+') '+msg); } return res; }
  try{
    var rawRes=await gh('GET', base+'/contents/'+GH.file+'?ref='+GH.branch, null, 'application/vnd.github.raw'); await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST', base+'/git/blobs', {content:encodeB64(out), encoding:'base64'}); await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET', base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้'); var ref=await refRes.json(); var headSha=ref.object.sha;
    var hcRes=await gh('GET', base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST', base+'/git/trees', {base_tree:hc.tree.sha, tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}]}); await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST', base+'/git/commits', {message:'Business Generation update via browser ['+new Date().toISOString().slice(0,16)+']', tree:tree.sha, parents:[headSha]}); await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH', base+'/git/refs/heads/'+GH.branch, {sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persistRaw(); tip('✓ บันทึกขึ้นเว็บแล้ว — live ใน ~1 นาที · เปิดเครื่องไหนก็เห็น');
  }catch(e){ S.savedAt=prev; tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}
document.getElementById('bPublish').addEventListener('click',publish);

/* init */
render(); recordHistory(); updateUndo();
tip('แก้ไขได้ทุกช่อง · Undo/Redo (Ctrl+Z/Y) · เพิ่มแถว/คอลัมน์ได้ · กด “บันทึกขึ้นเว็บ” เพื่อ live');
})();
</script>
</body>
