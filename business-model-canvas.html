<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCC — Business Model Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F0F4F8;--card:#FFFFFF;--ink:#1E3A5F;--mute:#5A6E88;--line:#D3DEEA;
  --blue:#0077B6;--blue2:#005A8E;--orange:#F7941D;--green:#2E7D32;--hi:#F5B301}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 50% -12%,#FFFFFF 0%,transparent 60%),var(--paper);
  color:var(--ink);font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
h1{font-family:'Inter','Sarabun',sans-serif;margin:0}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 14px;background:rgba(240,244,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:4px}
.brand b{font-family:'Inter';font-size:13px;font-weight:800;color:var(--blue2)}
.brand span{font-family:'Inter';font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8FA3B8}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.lbl{font-family:'Inter';font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#93A6BA}
button{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  background:#fff;color:#41566E;border:1px solid var(--line);padding:6px 9px;cursor:pointer;border-radius:6px;white-space:nowrap;transition:.14s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.pub{background:var(--blue2);border-color:var(--blue2);color:#fff}
button.pub:hover{background:#00466f;border-color:#00466f;color:#fff}
button:disabled{opacity:.5;cursor:default}
a.back{font-family:'Inter';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;
  text-decoration:none;color:#41566E;border:1px solid var(--line);padding:6px 9px;border-radius:6px}
a.back:hover{border-color:var(--blue);color:var(--blue)}
label.clr{display:inline-flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 6px;background:#fff}
label.clr input[type=color]{width:20px;height:18px;border:none;padding:0;background:none;cursor:pointer}
.sw{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw:hover{transform:scale(1.12)}
#autosave{font-family:'Inter';font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#B7C4D2;margin-left:auto;transition:color .25s}
#autosave.hit{color:var(--green)}
.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 22px rgba(30,58,95,.25)}
.tip.show{opacity:.96}
.wrap{max-width:1760px;margin:0 auto;padding:18px 16px 90px}
.hd-title{font-size:22px;font-weight:800;color:var(--blue2);margin:0 0 3px}
.hd-sub{font-size:13px;color:var(--mute);margin:0 0 12px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px;font-size:12.5px;color:var(--mute)}
.meta .mi{display:flex;gap:6px;align-items:baseline}
.meta .mk{font-family:'Inter';font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8FA3B8;white-space:nowrap}
.meta .mv{color:#26384d;min-width:40px}

/* ---- Business Model Canvas grid ---- */
.bmc{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));grid-auto-flow:row dense;align-items:stretch}
.blk{background:#fff;border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;
  min-height:120px;overflow:hidden;box-shadow:0 2px 12px rgba(30,58,95,.06)}
.blk.g-left{border-top:3px solid var(--blue)}
.blk.g-vp{border-top:3px solid var(--orange)}
.blk.g-right{border-top:3px solid var(--green)}
.blk.g-cost{border-top:3px solid #C0392B}
.blk.g-rev{border-top:3px solid var(--green)}
.blk.g-new{border-top:3px solid #8FA3B8}
.blk.dragging{opacity:.4}
.blk.dragover{outline:2px dashed var(--blue);outline-offset:-2px}
.blk-h{font-family:'Inter','Sarabun',sans-serif;font-weight:700;font-size:12px;padding:7px 11px;
  border-bottom:1px solid #E9EFF6;background:#F5F8FC;color:var(--blue2);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.blk-h .en{font-size:9.5px;color:#8FA3B8;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.blk-h .bdrag{display:none;cursor:grab;color:#AEBED0;font-size:13px;align-self:center}
.blk-h .bdrag:active{cursor:grabbing}
body.edit .blk-h .bdrag{display:inline}
.blk-h .bctl{margin-left:auto;display:none;gap:1px;align-self:center}
body.edit .blk-h .bctl{display:inline-flex}
.blk-h .bctl button{padding:1px 6px;font-size:11px;line-height:16px;border:1px solid transparent;background:transparent;color:#7a90a8;text-transform:none;letter-spacing:0}
.blk-h .bctl button:hover{color:var(--blue);background:#EAF3FA;border-color:var(--line)}
.blk-h .bctl .bx:hover{color:#fff;background:#C0392B;border-color:#C0392B}
/* ---- free layout (ลากวาง/ปรับขนาดอิสระ) ---- */
.bmc.free{display:block;position:relative;min-height:640px;border:1px dashed var(--line);border-radius:12px;background:
  linear-gradient(90deg,rgba(0,119,182,.04) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(rgba(0,119,182,.04) 1px,transparent 1px) 0 0/26px 26px}
.bmc.free .blk{position:absolute;min-height:60px;overflow:visible;box-shadow:0 3px 16px rgba(30,58,95,.10)}
.bmc.free .blk .blk-h{border-radius:10px 10px 0 0}
.bmc.free .blk .blk-b{overflow:auto;min-height:0;border-radius:0 0 10px 10px}
.bmc.free .blk-h .bdrag{cursor:move}
.bmc.free .blk .rsz{position:absolute;z-index:6;display:none}
body.edit .bmc.free .blk .rsz{display:block}
.bmc.free .blk .rsz.n,.bmc.free .blk .rsz.s{left:14px;right:14px;height:9px;cursor:ns-resize}
.bmc.free .blk .rsz.e,.bmc.free .blk .rsz.w{top:14px;bottom:14px;width:9px;cursor:ew-resize}
.bmc.free .blk .rsz.n{top:-4px}.bmc.free .blk .rsz.s{bottom:-4px}
.bmc.free .blk .rsz.w{left:-4px}.bmc.free .blk .rsz.e{right:-4px}
.bmc.free .blk .rsz.nw,.bmc.free .blk .rsz.ne,.bmc.free .blk .rsz.sw,.bmc.free .blk .rsz.se{
  width:12px;height:12px;background:#fff;border:1.5px solid var(--blue);border-radius:3px;z-index:7;box-shadow:0 1px 3px rgba(30,58,95,.3)}
.bmc.free .blk .rsz.nw{left:-6px;top:-6px;cursor:nwse-resize}
.bmc.free .blk .rsz.ne{right:-6px;top:-6px;cursor:nesw-resize}
.bmc.free .blk .rsz.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
.bmc.free .blk .rsz.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.blk-b{padding:9px 12px;font-size:calc(12.5px*var(--bfs,1));line-height:1.5;color:#26384d;flex:1;overflow:auto}
.blk-b p{margin:0 0 6px}
.blk-b ol,.blk-b ul{margin:4px 0;padding-left:20px}
.blk-b li{margin:2px 0}
.blk-b .note{background:#FFF8E8;border:1px solid #F1DFAE;border-radius:6px;padding:5px 8px;margin:0 0 7px;font-size:.95em;color:#7a5b12}
.blk-b .subh{font-weight:700;color:var(--blue2);margin:6px 0 3px}
.blk-b .todo{color:#B0392B;font-style:italic}
[contenteditable="true"]:focus{outline:2px solid var(--hi);outline-offset:2px;border-radius:4px}
body:not(.edit) [contenteditable]{cursor:default}
body.edit .blk-b:hover{background:#FFFDF6}
.foot{margin:14px 2px 0;font-size:12px;color:var(--mute);line-height:1.6}
.foot b{color:var(--blue2)}
#tokPanel{display:none;position:fixed;top:56px;right:14px;z-index:120;width:314px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:0 14px 44px rgba(30,58,95,.24)}
#tokPanel h4{font-family:'Inter';font-weight:800;font-size:14px;margin:0 0 5px}
#tokPanel p{font-size:11.5px;color:var(--mute);line-height:1.55;margin:0 0 10px}
#tokPanel code{background:#EEF3F8;padding:1px 5px;border-radius:4px;font-size:11px}
#tokInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',monospace;font-size:12px;background:#F8FBFE}
#tokInput:focus{outline:none;border-color:var(--blue)}
.tp-row{display:flex;gap:6px;margin-top:9px}
#tokState{font-size:11px;margin-top:8px;color:var(--mute)}
@media(max-width:900px){ .bmc{grid-template-columns:1fr!important} .blk{grid-column:1/-1!important;grid-row:auto!important} }
@media print{.bar,.tip,#tokPanel,.blk-h .bctl,.blk-h .bdrag,.bmc.free .blk .rsz{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}
  .blk{box-shadow:none;break-inside:avoid}
  .bmc.free{border:none;background:none}
  @page{size:A3 landscape;margin:8mm}}
</style>
</head>

function blocksToArray(bo){

}

/* ---------- state ---------- */
function fileData(){ try{ var el=document.getElementById('canvas-data'); if(el){ var o=JSON.parse(el.textContent); if(o) return o; } }catch(e){} return {}; }
var FD=fileData(), baseSavedAt=(typeof FD.savedAt==='number')?FD.savedAt:0;
function published(){ return (FD&&FD.blocks)?FD:seed(); }
var S=null;
try{ var raw=localStorage.getItem(LSK); if(raw){ var ls=JSON.parse(raw); if(ls&&ls.blocks&&(ls.savedAt||0)>=baseSavedAt) S=ls; } }catch(e){}
if(!S) S=published();
var sd=seed();
if(typeof S.savedAt!=='number') S.savedAt=baseSavedAt;
['fs','cols','title','sub','rst','author','foot'].forEach(function(k){ if(S[k]===undefined) S[k]=sd[k]; });
if(!S.blocks) S.blocks=sd.blocks;
S.blocks=normBlocks(S.blocks);
if(!(S.cols>=1)) S.cols=5;
if(S.layout!=='free') S.layout='grid';
if(!S.fs) S.fs=1;

var editMode=true;
var bmc=document.getElementById('bmc'), tipEl=document.getElementById('tip'), saveEl=document.getElementById('autosave');
var hist=[], hi=-1, restoring=false, saveT=null;
function tip(m){ tipEl.textContent=m; tipEl.classList.add('show'); clearTimeout(tip._t); tip._t=setTimeout(function(){tipEl.classList.remove('show')},2400); }
function persistRaw(){ try{ localStorage.setItem(LSK,JSON.stringify(S)); saveEl.classList.add('hit'); setTimeout(function(){saveEl.classList.remove('hit')},450); }catch(e){ saveEl.textContent='● เก็บชั่วคราวไม่ได้'; } }
function recordHistory(){ if(restoring) return; var s=JSON.stringify(S); if(hi>=0&&hist[hi]===s) return; hist=hist.slice(0,hi+1); hist.push(s); hi=hist.length-1; if(hist.length>40){hist.shift();hi--;} updateUndo(); }
function persist(){ recordHistory(); persistRaw(); }
function schedulePersist(){ clearTimeout(saveT); saveT=setTimeout(persist,500); }
function updateUndo(){ var u=document.getElementById('bUndo'),r=document.getElementById('bRedo'); if(u)u.disabled=hi<=0; if(r)r.disabled=hi>=hist.length-1; }

function render(){
  var ce=editMode?'true':'false';
  document.getElementById('hdTitle').innerHTML=S.title||'';
  document.getElementById('hdSub').innerHTML=S.sub||'';
  document.getElementById('mRst').innerHTML=S.rst||'';
  document.getElementById('mAuthor').innerHTML=S.author||'';
  document.getElementById('foot').innerHTML=S.foot||'';
  document.documentElement.style.setProperty('--bfs',S.fs||1);
  var free=S.layout==='free';
  bmc.classList.toggle('free',free);
  bmc.style.setProperty('--cols',S.cols||5);
  var RSZ='<div class="rsz n" data-dir="n"></div><div class="rsz s" data-dir="s"></div><div class="rsz e" data-dir="e"></div><div class="rsz w" data-dir="w"></div><div class="rsz nw" data-dir="nw"></div><div class="rsz ne" data-dir="ne"></div><div class="rsz sw" data-dir="sw"></div><div class="rsz se" data-dir="se"></div>';
  var h='';
  S.blocks.forEach(function(bl,i){
    var w=Math.min(bl.w||1,S.cols||5), ht=bl.ht||1, st;
    if(free){ st='left:'+(bl.fx||0)+'px;top:'+(bl.fy||0)+'px;width:'+(bl.fw||240)+'px;height:'+(bl.fh||160)+'px'+(bl.z?';z-index:'+bl.z:''); }
    else { st='grid-column:span '+w+';grid-row:span '+ht; }
    var ctl='<span class="bctl">'+
       (free?'':'<button data-act="w" data-i="'+i+'" title="ปรับความกว้าง (span '+w+')">↔</button>'+
              '<button data-act="h" data-i="'+i+'" title="ปรับความสูง (span '+ht+')">↕</button>')+
       '<button class="bx" data-act="del" data-i="'+i+'" title="ลบ Block นี้">✕</button></span>';
    h+='<div class="blk '+(bl.g||'g-new')+'" data-i="'+i+'" style="'+st+'">'+
       '<div class="blk-h">'+
       '<span class="bdrag" draggable="false" title="'+(free?'ลากเพื่อย้ายอิสระ':'ลากเพื่อย้าย Block')+'">⠿</span>'+
       '<span class="hlabel" data-bh="'+i+'" contenteditable="'+ce+'">'+(bl.h||'')+'</span>'+
       '<span class="en" data-ben="'+i+'" contenteditable="'+ce+'">'+(bl.en||'')+'</span>'+ctl+'</div>'+
       '<div class="blk-b" data-bb="'+i+'" contenteditable="'+ce+'">'+(bl.b||'')+'</div>'+
       (free?RSZ:'')+'</div>';
  });
  bmc.innerHTML=h;
  document.getElementById('bLayout').textContent = free?'▦ เลย์เอาต์: อิสระ':'▦ เลย์เอาต์: กริด';
  document.getElementById('bLayout').classList.toggle('on',free);
  document.getElementById('lblCols').style.display=free?'none':'';
  document.getElementById('bColDn').style.display=free?'none':'';
  document.getElementById('bColUp').style.display=free?'none':'';
  document.getElementById('bArrange').style.display=free?'':'none';
  if(free) fitFree();
}
function fitFree(){
  if(S.layout!=='free') return;
  var maxB=600;
  S.blocks.forEach(function(bl){ maxB=Math.max(maxB,(bl.fy||0)+(bl.fh||160)); });
  bmc.style.minHeight=(maxB+48)+'px';
}

/* read DOM back into S */
function syncAll(){
  S.title=document.getElementById('hdTitle').innerHTML;
  S.sub=document.getElementById('hdSub').innerHTML;
  S.rst=document.getElementById('mRst').innerHTML;
  S.author=document.getElementById('mAuthor').innerHTML;
  S.foot=document.getElementById('foot').innerHTML;
  bmc.querySelectorAll('[data-bb]').forEach(function(el){ var b=S.blocks[+el.dataset.bb]; if(b) b.b=el.innerHTML; });
  bmc.querySelectorAll('[data-bh]').forEach(function(el){ var b=S.blocks[+el.dataset.bh]; if(b) b.h=el.innerHTML; });
  bmc.querySelectorAll('[data-ben]').forEach(function(el){ var b=S.blocks[+el.dataset.ben]; if(b) b.en=el.innerHTML; });
}

/* live edit */
function bindInput(el, setter){ el.addEventListener('input',function(){ setter(this.innerHTML); schedulePersist(); }); }
bindInput(document.getElementById('hdTitle'),function(v){S.title=v;});
bindInput(document.getElementById('hdSub'),function(v){S.sub=v;});
bindInput(document.getElementById('mRst'),function(v){S.rst=v;});
bindInput(document.getElementById('mAuthor'),function(v){S.author=v;});
bindInput(document.getElementById('foot'),function(v){S.foot=v;});
bmc.addEventListener('input',function(e){
  var t=e.target.closest('[data-bb],[data-bh],[data-ben]'); if(!t) return;
  if(t.dataset.bb!==undefined){ var b=S.blocks[+t.dataset.bb]; if(b) b.b=t.innerHTML; }
  else if(t.dataset.bh!==undefined){ var b2=S.blocks[+t.dataset.bh]; if(b2) b2.h=t.innerHTML; }
  else if(t.dataset.ben!==undefined){ var b3=S.blocks[+t.dataset.ben]; if(b3) b3.en=t.innerHTML; }
  schedulePersist();
});

/* add / delete / resize blocks + drag-reorder + column count */
document.getElementById('bAddBlk').addEventListener('click',function(){
  if(!editMode){ tip('เปิด “✎ แก้ไข” ก่อน'); return; }
  syncAll();
  var nb={id:newBlockId(), h:'หัวข้อใหม่', en:'NEW BLOCK', b:'<p>พิมพ์เนื้อหาที่นี่…</p>', w:1, ht:1, g:'g-new'};
  if(S.layout==='free'){ var k=S.blocks.length; nb.fx=24+(k%6)*28; nb.fy=24+(k%6)*28; nb.fw=240; nb.fh=150; nb.z=++topZ; }
  S.blocks.push(nb);
  render(); persist(); tip(S.layout==='free'?'เพิ่ม Block แล้ว · ลาก ⠿ ย้าย · ลากมุม/ขอบปรับขนาด':'เพิ่ม Block แล้ว · ลาก ⠿ เพื่อย้าย · ↔ ↕ ปรับขนาด');
});
document.getElementById('bColUp').addEventListener('click',function(){ syncAll(); S.cols=Math.min(8,(S.cols||5)+1); render(); persist(); tip('คอลัมน์: '+S.cols); });
document.getElementById('bColDn').addEventListener('click',function(){ syncAll(); S.cols=Math.max(1,(S.cols||5)-1); render(); persist(); tip('คอลัมน์: '+S.cols); });
bmc.addEventListener('click',function(e){
  var btn=e.target.closest('button[data-act]'); if(!btn) return;
  var i=+btn.dataset.i, bl=S.blocks[i]; if(!bl) return;
  var act=btn.dataset.act; syncAll();
  if(act==='w'){ bl.w=(bl.w>=Math.min(S.cols,4))?1:(bl.w||1)+1; render(); persist(); tip('ความกว้าง Block: '+bl.w); }
  else if(act==='h'){ bl.ht=(bl.ht>=3)?1:(bl.ht||1)+1; render(); persist(); tip('ความสูง Block: '+bl.ht); }
  else if(act==='del'){ if(confirm('ลบ Block “'+(_txt(bl.h)||'')+'” ?')){ S.blocks.splice(i,1); render(); persist(); tip('ลบ Block แล้ว'); } }
});
function _txt(html){ var d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').trim(); }
/* GRID mode: drag-reorder via the ⠿ handle (HTML5 DnD) */
var dragI=-1;
bmc.addEventListener('mousedown',function(e){ if(S.layout==='free') return; var hd=e.target.closest('.bdrag'); if(!hd) return; var blk=hd.closest('.blk'); if(!blk) return; blk.draggable=true; var reset=function(){ if(dragI<0) blk.draggable=false; document.removeEventListener('mouseup',reset); }; document.addEventListener('mouseup',reset); });
bmc.addEventListener('dragstart',function(e){ if(S.layout==='free'){ e.preventDefault(); return; } var blk=e.target.closest('.blk'); if(!blk||!blk.draggable) { e.preventDefault(); return; } dragI=+blk.dataset.i; e.dataTransfer.effectAllowed='move'; try{ e.dataTransfer.setData('text/plain',String(dragI)); }catch(_){}; blk.classList.add('dragging'); });
bmc.addEventListener('dragover',function(e){ if(dragI<0) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; var blk=e.target.closest('.blk'); bmc.querySelectorAll('.blk.dragover').forEach(function(n){n.classList.remove('dragover')}); if(blk && +blk.dataset.i!==dragI) blk.classList.add('dragover'); });
bmc.addEventListener('drop',function(e){ if(dragI<0) return; e.preventDefault(); var blk=e.target.closest('.blk'); if(blk){ var to=+blk.dataset.i; syncAll(); var arr=S.blocks.slice(), b=arr.splice(dragI,1)[0]; arr.splice(to>dragI?to-1:to,0,b); S.blocks=arr; render(); persist(); tip('ย้าย Block แล้ว'); } cleanupDrag(); });
bmc.addEventListener('dragend',cleanupDrag);
function cleanupDrag(){ dragI=-1; bmc.querySelectorAll('.blk').forEach(function(n){ n.draggable=false; n.classList.remove('dragging'); n.classList.remove('dragover'); }); }

/* FREE mode: move (⠿) + resize (8 handles), absolute positioning */
var topZ=10, fdrag=null;
function bringFront(i){ var bl=S.blocks[i]; if(!bl) return; bl.z=++topZ; var el=bmc.querySelector('.blk[data-i="'+i+'"]'); if(el) el.style.zIndex=bl.z; }
bmc.addEventListener('mousedown',function(e){
  if(S.layout!=='free' || !editMode) return;
  var blk=e.target.closest('.blk'); if(!blk) return;
  var i=+blk.dataset.i, bl=S.blocks[i]; if(!bl) return;
  var rz=e.target.closest('.rsz'), hd=e.target.closest('.bdrag');
  if(rz){ fdrag={mode:'size',i:i,dir:rz.dataset.dir,sx:e.clientX,sy:e.clientY,x0:bl.fx||0,y0:bl.fy||0,w0:bl.fw||240,h0:bl.fh||160}; bringFront(i); e.preventDefault(); e.stopPropagation(); }
  else if(hd){ fdrag={mode:'move',i:i,sx:e.clientX,sy:e.clientY,x0:bl.fx||0,y0:bl.fy||0}; bringFront(i); e.preventDefault(); }
});
window.addEventListener('mousemove',function(e){
  if(!fdrag) return;
  var bl=S.blocks[fdrag.i], el=bmc.querySelector('.blk[data-i="'+fdrag.i+'"]'); if(!bl||!el) return;
  var dx=e.clientX-fdrag.sx, dy=e.clientY-fdrag.sy;
  if(fdrag.mode==='move'){ bl.fx=Math.max(0,fdrag.x0+dx); bl.fy=Math.max(0,fdrag.y0+dy); el.style.left=bl.fx+'px'; el.style.top=bl.fy+'px'; }
  else { var dir=fdrag.dir, L=fdrag.x0,T=fdrag.y0,W=fdrag.w0,H=fdrag.h0, minW=130,minH=64;
    if(dir.indexOf('e')>=0) W=Math.max(minW,fdrag.w0+dx);
    if(dir.indexOf('w')>=0){ W=Math.max(minW,fdrag.w0-dx); L=fdrag.x0+(fdrag.w0-W); }
    if(dir.indexOf('s')>=0) H=Math.max(minH,fdrag.h0+dy);
    if(dir.indexOf('n')>=0){ H=Math.max(minH,fdrag.h0-dy); T=fdrag.y0+(fdrag.h0-H); }
    bl.fx=Math.max(0,L); bl.fy=Math.max(0,T); bl.fw=W; bl.fh=H;
    el.style.left=bl.fx+'px'; el.style.top=bl.fy+'px'; el.style.width=W+'px'; el.style.height=H+'px';
  }
});
window.addEventListener('mouseup',function(){ if(!fdrag) return; fdrag=null; fitFree(); persist(); });

/* switch grid <-> free; derive free coords from the current grid render so nothing jumps */
function measureIntoFree(){
  syncAll();
  var wasFree=S.layout==='free';
  S.layout='grid'; render();
  var cr=bmc.getBoundingClientRect();
  bmc.querySelectorAll('.blk').forEach(function(el){ var i=+el.dataset.i, r=el.getBoundingClientRect(), b=S.blocks[i];
    b.fx=Math.round(r.left-cr.left); b.fy=Math.round(r.top-cr.top); b.fw=Math.round(r.width); b.fh=Math.round(r.height); });
  S.layout='free'; render();
}
document.getElementById('bLayout').addEventListener('click',function(){
  if(S.layout==='free'){ syncAll(); S.layout='grid'; render(); persist(); tip('โหมดกริดอัตโนมัติ'); }
  else { measureIntoFree(); persist(); tip('โหมดอิสระ · ลาก ⠿ เพื่อย้าย · ลากมุม/ขอบเพื่อปรับขนาด'); }
});
document.getElementById('bArrange').addEventListener('click',function(){ measureIntoFree(); persist(); tip('จัดตำแหน่งเป็น BMC มาตรฐานแล้ว (ปรับต่อได้อิสระ)'); });

/* font size + text formatting */
function setFs(v){ S.fs=Math.round(Math.min(1.8,Math.max(.7,v))*100)/100; document.documentElement.style.setProperty('--bfs',S.fs); persist(); tip('ขนาดตัวอักษร '+Math.round(S.fs*100)+'%'); }
document.getElementById('fsUp').addEventListener('click',function(){ setFs((S.fs||1)+.1); });
document.getElementById('fsDn').addEventListener('click',function(){ setFs((S.fs||1)-.1); });
function inWrap(node){ node=node&&(node.nodeType===1?node:node.parentNode); return !!(node&&document.querySelector('.wrap').contains(node)); }
function fmt(cmd,val){
  if(!editMode){ tip('เปิด “✎ แก้ไข” ก่อน'); return; }
  var s=window.getSelection();
  if(!(s&&s.rangeCount&&!s.isCollapsed&&inWrap(s.anchorNode))){ tip('ลากคลุมข้อความในช่องก่อน'); return; }
  document.execCommand('styleWithCSS',false,true);
  document.execCommand(cmd,false,val||null);
  syncAll(); persist();
}
document.getElementById('fmtB').addEventListener('click',function(){ fmt('bold'); });
document.getElementById('fmtI').addEventListener('click',function(){ fmt('italic'); });
document.querySelectorAll('.sw[data-tc]').forEach(function(b){ b.addEventListener('click',function(){ fmt('foreColor', b.getAttribute('data-tc')); }); });
document.getElementById('txtColor').addEventListener('input',function(){ fmt('foreColor', this.value); });

/* undo / redo */
function loadState(json){ restoring=true; S=JSON.parse(json); render(); persistRaw(); restoring=false; updateUndo(); }
function undo(){ if(hi>0){ hi--; loadState(hist[hi]); tip('ย้อนกลับแล้ว'); } else tip('ไม่มีให้ย้อน'); }
function redo(){ if(hi<hist.length-1){ hi++; loadState(hist[hi]); tip('ทำซ้ำแล้ว'); } else tip('ไม่มีให้ทำซ้ำ'); }
document.getElementById('bUndo').addEventListener('click',undo);
document.getElementById('bRedo').addEventListener('click',redo);
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){ e.preventDefault(); redo(); }
});

/* edit toggle */
document.getElementById('bEdit').addEventListener('click',function(){
  syncAll(); editMode=!editMode; this.classList.toggle('on',editMode); document.body.classList.toggle('edit',editMode);
  render(); tip(editMode?'แก้ไขได้ทุกช่อง':'ล็อกแล้ว');
});

/* JSON save / open */
document.getElementById('bSave').addEventListener('click',function(){ syncAll(); var blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='PCC_Business_Model_Canvas.json'; a.click(); setTimeout(function(){URL.revokeObjectURL(a.href)},1000); tip('บันทึกไฟล์แล้ว'); });
var fo=document.createElement('input'); fo.type='file'; fo.accept='application/json,.json'; fo.style.display='none'; document.body.appendChild(fo);
document.getElementById('bOpen').addEventListener('click',function(){ fo.click(); });
fo.addEventListener('change',function(){ var f=fo.files[0]; if(!f) return; var fr=new FileReader(); fr.onload=function(e){ try{
  var o=JSON.parse(e.target.result); if(!o.blocks) throw 0; S=o; if(!S.fs)S.fs=1;
  var s2=seed(); ['title','sub','rst','author','foot','cols'].forEach(function(k){ if(S[k]===undefined) S[k]=s2[k]; });
  S.blocks=normBlocks(S.blocks); if(!(S.cols>=1)) S.cols=5;
  render(); persist(); tip('เปิดไฟล์แล้ว'); }catch(err){ tip('ไฟล์ไม่ถูกต้อง'); } fo.value=''; }; fr.readAsText(f); });
document.getElementById('bPrint').addEventListener('click',function(){ window.print(); });

/* token */
var tokPanel=document.getElementById('tokPanel'), tokInput=document.getElementById('tokInput'), tokState=document.getElementById('tokState');
function tokGet(){ try{ return (localStorage.getItem('pcc_gh_tok')||'').trim(); }catch(e){ return ''; } }
function refreshTok(){ var t=tokGet(); tokState.textContent=t?('● มี token แล้ว ('+t.slice(0,4)+'…'+t.slice(-3)+')'):'○ ยังไม่มี token'; tokState.style.color=t?'var(--green)':'#B0392B'; }
function openTok(){ tokPanel.style.display='block'; tokInput.value=''; refreshTok(); setTimeout(function(){tokInput.focus();},30); }
document.getElementById('bTok').addEventListener('click',function(){ tokPanel.style.display==='block'?(tokPanel.style.display='none'):openTok(); });
document.getElementById('tokClose').addEventListener('click',function(){ tokPanel.style.display='none'; });
document.getElementById('tokSave').addEventListener('click',function(){ var v=(tokInput.value||'').trim(); if(!v){ tip('ยังไม่ได้พิมพ์ token'); return; } try{ localStorage.setItem('pcc_gh_tok',v); refreshTok(); tip('เก็บ token แล้ว'); }catch(e){ tip('เก็บไม่ได้'); } tokInput.value=''; });
document.getElementById('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} refreshTok(); tip('ลบ token แล้ว'); });

/* save to web (Git Data API) */
function encodeB64(str){ var bytes=new TextEncoder().encode(str),r='',ch=3*1024; for(var i=0;i<bytes.length;i+=ch){ var sl=bytes.subarray(i,i+ch),bin=''; for(var j=0;j<sl.length;j++)bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
var DATA_RE=/<!--CANVAS_DATA_START-->[\s\S]*?<!--CANVAS_DATA_END-->/;
function dataBlock(json){ return '<!--CANVAS_DATA_START-->\n<script id="canvas-data" type="application/json">'+json+'<\/script>\n<!--CANVAS_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ openTok(); tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=document.getElementById('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  syncAll(); var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo;
  function gh(m,p,body,accept){ var h={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'}; var o={method:m,headers:h}; if(body!=null){ h['Content-Type']='application/json'; o.body=JSON.stringify(body); } return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var msg=''; try{ msg=(await res.json()).message||''; }catch(_){}
      throw new Error(label+' ('+res.status+(res.status===401?' — token ไม่ถูกต้อง':(res.status===403?' — token ไม่มีสิทธิ์':''))+') '+msg); } return res; }
  try{
    var rawRes=await gh('GET', base+'/contents/'+GH.file+'?ref='+GH.branch, null, 'application/vnd.github.raw'); await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST', base+'/git/blobs', {content:encodeB64(out), encoding:'base64'}); await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET', base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้'); var ref=await refRes.json(); var headSha=ref.object.sha;
    var hcRes=await gh('GET', base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST', base+'/git/trees', {base_tree:hc.tree.sha, tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}]}); await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST', base+'/git/commits', {message:'Business Model Canvas update via browser ['+new Date().toISOString().slice(0,16)+']', tree:tree.sha, parents:[headSha]}); await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH', base+'/git/refs/heads/'+GH.branch, {sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persistRaw(); tip('✓ บันทึกขึ้นเว็บแล้ว — live ใน ~1 นาที · เปิดเครื่องไหนก็เห็น');
  }catch(e){ S.savedAt=prev; tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}
document.getElementById('bPublish').addEventListener('click',publish);

/* init */
render(); recordHistory(); updateUndo();
tip('แก้ไขได้ทุกช่อง · Undo/Redo (Ctrl+Z/Y) · กด “บันทึกขึ้นเว็บ” เพื่อ live ทุกเครื่อง');
})();
</script>
