<html lang="th">
<head>

<style>
:root{--paper:#F0F4F8;--card:#FFFFFF;--ink:#1E3A5F;--mute:#5A6E88;--line:#D3DEEA;
  --blue:#0077B6;--blue2:#005A8E;--orange:#F7941D;--green:#2E7D32;--hi:#F5B301}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 620px at 50% -12%,#FFFFFF 0%,transparent 60%),var(--paper);
  color:var(--ink);font-family:'Sarabun','Inter','Noto Sans Thai',system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
h1{font-family:'Inter','Sarabun',sans-serif;margin:0}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:8px 14px;background:rgba(240,244,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:4px}
.brand b{font-family:'Inter';font-size:13px;font-weight:800;color:var(--blue2)}
.brand span{font-family:'Inter';font-size:8.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8FA3B8}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.lbl{font-family:'Inter';font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#93A6BA}
button{font-family:'Inter','Sarabun',sans-serif;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  background:#fff;color:#41566E;border:1px solid var(--line);padding:6px 9px;cursor:pointer;border-radius:6px;white-space:nowrap;transition:.14s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.pub{background:var(--blue2);border-color:var(--blue2);color:#fff}
button.pub:hover{background:#00466f;border-color:#00466f;color:#fff}
button:disabled{opacity:.5;cursor:default}
a.back{font-family:'Inter';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;
  text-decoration:none;color:#41566E;border:1px solid var(--line);padding:6px 9px;border-radius:6px}
a.back:hover{border-color:var(--blue);color:var(--blue)}
#autosave{font-family:'Inter';font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#B7C4D2;margin-left:auto;transition:color .25s}
#autosave.hit{color:var(--green)}
.tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 6px 22px rgba(30,58,95,.25)}
.tip.show{opacity:.96}
.wrap{max-width:1900px;margin:0 auto;padding:18px 16px 90px}
.hd-title{font-size:22px;font-weight:800;color:var(--blue2);margin:0 0 2px}
.hd-sub{font-size:12.5px;color:var(--mute);margin:0 0 12px;line-height:1.5}
/* summary + filters */
.dash{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 13px;font-size:12px;display:flex;gap:8px;align-items:baseline}
.stat b{font-family:'Inter';font-size:16px;color:var(--blue2)}
.stat.warn b{color:#C0392B}
.lvchip{font-family:'Inter';font-size:11px;font-weight:700;background:#EAF3FA;border:1px solid #CBDEF0;border-radius:14px;padding:3px 10px;color:var(--blue2)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:12px}
.filters select,.filters input[type=search]{font-family:'Sarabun';font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.filters label.ck{display:inline-flex;gap:5px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
/* table */
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 3px 18px rgba(30,58,95,.07);background:#fff}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:1820px;font-size:12.5px}
thead th{background:var(--blue2);color:#fff;font-family:'Inter','Sarabun',sans-serif;font-weight:700;font-size:11.5px;
  padding:7px 9px;text-align:left;vertical-align:middle;border:1px solid #14496e;position:sticky;top:0;z-index:5}
thead th.oi{background:#0a5b8c}
tbody td{border:1px solid var(--line);padding:7px 9px;vertical-align:top;white-space:pre-wrap;line-height:1.5;
  color:#26384d;font-size:calc(12.5px * var(--tfs,1));overflow-wrap:anywhere}
tr.comp-h td{background:var(--blue2);color:#fff;font-family:'Inter','Sarabun';font-weight:800;font-size:13px;padding:8px 12px;border-color:#14496e}
tr.unit-h td{background:#E4EEF7;color:var(--blue2);font-weight:800;font-size:12.5px;padding:6px 12px;border-top:2px solid var(--blue2)}
tr.unit-h td .cnt{font-weight:600;color:#7d93aa;font-size:11px}
td.person{width:230px;background:#F8FBFE}
td.person .nm{font-weight:800;color:var(--ink)}
td.person .ps{font-size:11px;color:var(--mute);margin-top:2px;line-height:1.4}
.lv{display:inline-block;font-family:'Inter';font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:1px 8px;margin-top:5px}
.lv.l9{background:#5B34A6}.lv.l8{background:#0077B6}.lv.l7{background:#3E8A2E}
td.bp-c{background:#F2F8FC;font-weight:700}
td.out-c{background:#F2F8FC}td.oc-c{background:#F0F8F1}td.im-c{background:#FFF7EC}
.tag{display:inline-block;font-family:'Inter';font-size:9.5px;font-weight:800;border-radius:5px;padding:2px 7px;margin:1px 3px 1px 0;color:#fff;cursor:default}
.t-STEM{background:#7B4FC9}.t-IT{background:#0077B6}.t-AI{background:#E8484F}.t-Automation{background:#E8820E}
.tag.off{background:#E7EDF4;color:#9AACBE}
body.edit .tag{cursor:pointer}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:12px;padding:2px 9px;background:#F1F4F8;color:#7d93aa;cursor:default}
.st.s1{background:#FFF3D6;color:#C98A00}.st.s2{background:#E3F3E4;color:var(--green)}
body.edit .st{cursor:pointer}
.doc{display:inline-flex;align-items:center;gap:4px;font-family:'Inter','Sarabun';font-size:11px;font-weight:700;text-decoration:none;
  color:var(--orange);background:#FFF4E4;border:1px solid #F6D9AD;padding:2px 9px;border-radius:14px;margin-top:3px}
.doc:hover{background:var(--orange);color:#fff}
.doc .rm{opacity:.7}.doc .rm:hover{color:#C0392B}
td.ctrl{width:86px;white-space:nowrap;text-align:center;background:#fff}
td.ctrl button{padding:2px 5px;font-size:11px;margin:1px;text-transform:none;border-color:transparent;background:transparent}
td.ctrl button:hover{background:#EAF3FA}
td.ctrl .del:hover{background:#C0392B;color:#fff}
body:not(.edit) td.ctrl,body:not(.edit) th.ctrl{display:none}
tr.unassigned td.empty{background:#FDF3F2;color:#B0392B;text-align:center;font-weight:600}
tr.unassigned td.empty button{margin-left:10px;text-transform:none;border-color:#E4B7B2;color:#B0392B}
tr.unassigned td.empty button:hover{background:#B0392B;color:#fff}
[contenteditable="true"]:focus{outline:2px solid var(--hi);outline-offset:-2px}
body.edit tbody td[contenteditable]:hover{background:#FFFBEF}
#tokPanel{display:none;position:fixed;top:56px;right:14px;z-index:120;width:314px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:15px 16px;box-shadow:0 14px 44px rgba(30,58,95,.24)}
#tokPanel h4{font-family:'Inter';font-weight:800;font-size:14px;margin:0 0 5px}
#tokPanel p{font-size:11.5px;color:var(--mute);line-height:1.55;margin:0 0 10px}
#tokPanel code{background:#EEF3F8;padding:1px 5px;border-radius:4px;font-size:11px}
#tokInput{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',monospace;font-size:12px;background:#F8FBFE}
.tp-row{display:flex;gap:6px;margin-top:9px}
#tokState{font-size:11px;margin-top:8px;color:var(--mute)}
@media print{.bar,.tip,#tokPanel,.filters,td.ctrl,th.ctrl,.doc .rm{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}.tbl-scroll{overflow:visible;border:none;box-shadow:none}
  table{min-width:0;font-size:9.5px}thead th{position:static}@page{size:A3 landscape;margin:8mm}}
</style>
</head>

/* ---------- state ---------- */

function published(){ return (FD&&Array.isArray(FD.people))?FD:seed(); }

var sd=seed();
if(typeof S.savedAt!=='number') S.savedAt=baseSavedAt;
['fs','title','sub'].forEach(function(k){ if(S[k]===undefined) S[k]=sd[k]; });

/* migrate: means เดิมเป็นแท็ก (array) → ย้ายไปช่อง Resources (res) แล้วให้ means เป็นข้อความพิมพ์ */
function migrateAssigns(){
  S.people.forEach(function(p){ p.assigns.forEach(function(a){
    if(Array.isArray(a.means)){ if(!Array.isArray(a.res)) a.res=a.means; a.means=''; }
    if(!Array.isArray(a.res)) a.res=[];
    if(typeof a.means!=='string') a.means='';
  }); });
}
migrateAssigns();
if(!S.fs) S.fs=1;

var hist=[], hi=-1, restoring=false, saveT=null;

function tip(m){ tipEl.textContent=m; tipEl.classList.add('show'); clearTimeout(tip._t); tip._t=setTimeout(function(){tipEl.classList.remove('show')},2600); }
function persistRaw(){ try{ localStorage.setItem(LSK,JSON.stringify(S)); saveEl.classList.add('hit'); setTimeout(function(){saveEl.classList.remove('hit')},450); }catch(e){ saveEl.textContent='● เก็บชั่วคราวไม่ได้'; } }
function recordHistory(){ if(restoring) return; var s=JSON.stringify(S); if(hi>=0&&hist[hi]===s) return; hist=hist.slice(0,hi+1); hist.push(s); hi=hist.length-1; if(hist.length>40){hist.shift();hi--;} updateUndo(); }
function persist(){ recordHistory(); persistRaw(); }
function schedulePersist(){ clearTimeout(saveT); saveT=setTimeout(persist,500); }
function updateUndo(){ var u=document.getElementById('bUndo'),r=document.getElementById('bRedo'); if(u)u.disabled=hi<=0; if(r)r.disabled=hi>=hist.length-1; }
function esc(s){ return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function hrefOf(a){ if(a.link) return normUrl(a.link); if(a.file) return a.file.path||a.file.data||''; return ''; }

/* ---------- filtering / grouping ---------- */
function personMatches(p){
  if(F.comp && p.comp!==F.comp) return false;
  if(F.unit && p.unit!==F.unit) return false;
  if(F.lvl && p.lvl!==F.lvl) return false;
  if(F.un && p.assigns.length>0) return false;
  if(F.means){ var ok=p.assigns.some(function(a){ return (a.res||[]).indexOf(F.means)>=0; }); if(!ok) return false; }
  if(F.q){ var q=F.q.toLowerCase(); var blob=(p.name+' '+p.pos+' '+p.unit+' '+p.assigns.map(function(a){return (a.bp||'')+' '+(a.ap||'');}).join(' ')).toLowerCase(); if(blob.indexOf(q)<0) return false; }
  return true;
}

/* ---------- token ---------- */
var tokPanel=document.getElementById('tokPanel'), tokInput=document.getElementById('tokInput'), tokState=document.getElementById('tokState');
function tokGet(){ try{ return (localStorage.getItem('pcc_gh_tok')||'').trim(); }catch(e){ return ''; } }
function refreshTok(){ var t=tokGet(); tokState.textContent=t?('● มี token แล้ว ('+t.slice(0,4)+'…'+t.slice(-3)+')'):'○ ยังไม่มี token'; tokState.style.color=t?'var(--green)':'#B0392B'; }
function openTok(){ tokPanel.style.display='block'; tokInput.value=''; refreshTok(); setTimeout(function(){tokInput.focus();},30); }
document.getElementById('bTok').addEventListener('click',function(){ tokPanel.style.display==='block'?(tokPanel.style.display='none'):openTok(); });
document.getElementById('tokClose').addEventListener('click',function(){ tokPanel.style.display='none'; });
document.getElementById('tokSave').addEventListener('click',function(){ var v=(tokInput.value||'').trim(); if(!v){ tip('ยังไม่ได้พิมพ์ token'); return; } try{ localStorage.setItem('pcc_gh_tok',v); refreshTok(); tip('เก็บ token แล้ว'); }catch(e){ tip('เก็บไม่ได้'); } tokInput.value=''; });
document.getElementById('tokClear').addEventListener('click',function(){ try{ localStorage.removeItem('pcc_gh_tok'); }catch(e){} refreshTok(); tip('ลบ token แล้ว'); });

/* ---------- save to web (Git Data API) ---------- */
function encodeB64(str){ var bytes=new TextEncoder().encode(str),r='',ch=3*1024; for(var i=0;i<bytes.length;i+=ch){ var sl=bytes.subarray(i,i+ch),bin=''; for(var j=0;j<sl.length;j++)bin+=String.fromCharCode(sl[j]); r+=btoa(bin); } return r; }
function parseDataURL(d){ var m=/^data:([^;]*);base64,(.*)$/.exec(d||''); if(!m) return null; return {mime:m[1]||'application/octet-stream', b64:m[2]}; }
function extOf(name,mime){ var m=/\.([A-Za-z0-9]{1,6})$/.exec(name||''); if(m) return m[1].toLowerCase(); if(/pdf/.test(mime))return'pdf'; if(/png/.test(mime))return'png'; if(/jpe?g/.test(mime))return'jpg'; if(/wordprocessingml/.test(mime))return'docx'; if(/presentationml/.test(mime))return'pptx'; if(/spreadsheetml/.test(mime))return'xlsx'; return 'bin'; }
async function sha1hex(b64){ try{ var bin=atob(b64), bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i); var buf=await crypto.subtle.digest('SHA-1',bytes); return Array.from(new Uint8Array(buf)).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('').slice(0,20);}catch(e){ var h=5381; for(var k=0;k<b64.length;k++)h=((h<<5)+h+b64.charCodeAt(k))>>>0; return h.toString(16);} }
var DATA_RE=/<!--PLAN_DATA_START-->[\s\S]*?<!--PLAN_DATA_END-->/;
function dataBlock(json){ return '<!--PLAN_DATA_START-->\n<script id="plan-data" type="application/json">'+json+'<\/script>\n<!--PLAN_DATA_END-->'; }
var publishing=false;
async function publish(){
  if(publishing) return;
  var token=tokGet(); if(!token){ openTok(); tip('ใส่ GitHub token ก่อน'); return; }
  publishing=true; var btn=document.getElementById('bPublish'), lbl=btn.textContent; btn.disabled=true; btn.textContent='⏳ กำลังบันทึก…';
  syncAll(); var stamp=Date.now(), prev=S.savedAt; S.savedAt=stamp;
  var base='/repos/'+GH.owner+'/'+GH.repo, orig=[];
  function gh(m,p,body,accept){ var hh={Authorization:'token '+token,Accept:accept||'application/vnd.github+json'}; var o={method:m,headers:hh}; if(body!=null){ hh['Content-Type']='application/json'; o.body=JSON.stringify(body); } return fetch(GH.api+p,o); }
  async function must(res,label){ if(!res.ok){ var m=''; try{ m=(await res.json()).message||''; }catch(_){}
      throw new Error(label+' ('+res.status+(res.status===401?' — token ไม่ถูกต้อง':(res.status===403?' — token ไม่มีสิทธิ์':''))+') '+m); } return res; }
  try{
    var fileEntries=[], seen={}, moved=0, carriers=[];
    S.people.forEach(function(p){ p.assigns.forEach(function(a){ if(a.file&&a.file.data) carriers.push(a); }); });
    for(var i=0;i<carriers.length;i++){ var a=carriers[i];
      var pd=parseDataURL(a.file.data); if(!pd) continue;
      btn.textContent='⏳ อัปไฟล์แนบ '+(moved+1)+'…';
      var hash=await sha1hex(pd.b64), ext=extOf(a.file.name,pd.mime), path=FILE_DIR+hash+'.'+ext;
      if(!seen[path]){ var fb=await gh('POST',base+'/git/blobs',{content:pd.b64,encoding:'base64'}); await must(fb,'อัปไฟล์ไม่สำเร็จ'); var fbj=await fb.json(); fileEntries.push({path:path,mode:'100644',type:'blob',sha:fbj.sha}); seen[path]=1; }
      orig.push({a:a,file:a.file}); a.file={name:a.file.name,path:path}; moved++;
    }
    btn.textContent='⏳ กำลังบันทึก…';
    var rawRes=await gh('GET',base+'/contents/'+GH.file+'?ref='+GH.branch,null,'application/vnd.github.raw'); await must(rawRes,'อ่านไฟล์ไม่ได้'); var text=await rawRes.text();
    if(!DATA_RE.test(text)) throw new Error('ไม่พบจุดฝังข้อมูลในไฟล์');
    var safe=JSON.stringify(S).replace(/</g,'\\u003c');
    var out=text.replace(DATA_RE,function(){ return dataBlock(safe); });
    var blobRes=await gh('POST',base+'/git/blobs',{content:encodeB64(out),encoding:'base64'}); await must(blobRes,'สร้าง blob ไม่สำเร็จ'); var blob=await blobRes.json();
    var refRes=await gh('GET',base+'/git/ref/heads/'+GH.branch); await must(refRes,'อ่าน ref ไม่ได้'); var ref=await refRes.json(); var headSha=ref.object.sha;
    var hcRes=await gh('GET',base+'/git/commits/'+headSha); await must(hcRes,'อ่าน commit ไม่ได้'); var hc=await hcRes.json();
    var treeRes=await gh('POST',base+'/git/trees',{base_tree:hc.tree.sha, tree:[{path:GH.file,mode:'100644',type:'blob',sha:blob.sha}].concat(fileEntries)}); await must(treeRes,'สร้าง tree ไม่สำเร็จ'); var tree=await treeRes.json();
    var cmtRes=await gh('POST',base+'/git/commits',{message:'Business Plan Execution update via browser ['+new Date().toISOString().slice(0,16)+']', tree:tree.sha, parents:[headSha]}); await must(cmtRes,'สร้าง commit ไม่สำเร็จ'); var commit=await cmtRes.json();
    await must(await gh('PATCH',base+'/git/refs/heads/'+GH.branch,{sha:commit.sha}),'อัปเดต ref ไม่สำเร็จ');
    baseSavedAt=stamp; persistRaw(); tip('✓ บันทึกขึ้นเว็บแล้ว'+(moved?(' · อัป '+moved+' ไฟล์แนบ'):'')+' — live ใน ~1 นาที');
  }catch(e){ S.savedAt=prev; orig.forEach(function(o){ o.a.file=o.file; }); tip('✗ '+(e&&e.message?e.message:'ผิดพลาด')); }
  finally{ publishing=false; btn.disabled=false; btn.textContent=lbl; }
}

render(); recordHistory(); updateUndo();
tip('มอบหมายโครงการ: กด “＋ มอบหมายโครงการ” ที่รายชื่อ · พิมพ์ Means (Developer) ได้เลย · คลิกแท็ก Resources เพื่อเปิด/ปิด · คลิกสถานะเพื่อเปลี่ยน · กด “บันทึกขึ้นเว็บ” เพื่อ live');
})();
